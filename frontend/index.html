<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSH — Real Sim Hub v1.0.0</title>
    <style>
      /* Pre-paint fallback colours (L2): the #root fallback below is
         light by default and follows the OS dark scheme via media
         query, so a JS failure never paints a light-only box on a
         dark system. (The stored theme cannot be read without JS;
         the OS scheme is the closest pre-JS signal.) */
      .rsh-fallback {
        background: #f5f3ff;
        color: #1f1b2e;
      }
      .rsh-fallback .rsh-fallback-card {
        background: #ffffff;
      }
      .rsh-fallback .rsh-fallback-sub {
        color: #5f5a7a;
      }
      @media (prefers-color-scheme: dark) {
        .rsh-fallback {
          background: #0b0e13;
          color: #f2f4f7;
        }
        .rsh-fallback .rsh-fallback-card {
          background: #14181f;
        }
        .rsh-fallback .rsh-fallback-sub {
          color: #9aa3af;
        }
      }
    </style>
  </head>
  <body>
    <!-- Literal fallback text: if JavaScript fails to load, the window still
         paints real text instead of going blank (the C# blank-window lesson).
         React replaces this content on mount. -->
    <div id="root"><main class="rsh-fallback" style="font-family:Inter,system-ui,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0"><div class="rsh-fallback-card" style="border-radius:16px;padding:32px 48px;text-align:center"><h1 style="margin:0;font-size:32px;color:#6C4CF1">RSH v1.0.0</h1><p class="rsh-fallback-sub" style="margin:8px 0 0">Real Sim Hub</p><noscript><p style="margin:16px 0 0;font-size:14px">RSH needs JavaScript to run. Please enable JavaScript and reload.</p></noscript></div></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
