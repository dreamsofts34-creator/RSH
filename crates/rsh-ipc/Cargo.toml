[package]
name = "rsh-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RSH v2.0 local IPC: named pipe (Windows) / Unix socket (Linux), JSON lines, versioned protocol, current-user-only access. Daemon hosts the server; the Slint UI (Phase 3) uses the client library."
publish = false

[dependencies]
rsh-api = { path = "../rsh-api" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "fs", "time"] }

[lints]
workspace = true
