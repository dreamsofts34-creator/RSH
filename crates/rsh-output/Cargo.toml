[package]
name = "rsh-output"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rsh-engine = { path = "../rsh-engine" }
# Hand-written vJoy FFI goes through libloading (no `vjoy` crate —
# unverified, single maintainer). Exact pin, workspace convention.
libloading = "=0.7.4"
# DLL SHA-256 verification (SW-R6.4). Same pin as rsh-security.
sha2 = "=0.11.1"

# Windows-only: registry probe for the vJoy install location (D18).
# The `windows` crate does not compile on Linux, so this is strictly
# a target-gated dependency (workspace convention, root Cargo.toml).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security", "Win32_System_Registry"] }
