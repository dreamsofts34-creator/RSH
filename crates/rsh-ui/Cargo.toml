[package]
name = "rsh-ui"
version.workspace = true
edition = "2021"
license = "MIT"
description = "RSH v2.0 Slint UI (Phase 3): app shell + component library. Talks to the daemon over rsh-ipc using the typed rsh-api surface; simulated data until the daemon is live."
publish = false

[[bin]]
name = "rsh-ui"
path = "src/main.rs"

[dependencies]
rsh-api = { path = "../rsh-api" }
rsh-ipc = { path = "../rsh-ipc" }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = "=1.18.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

[build-dependencies]
slint-build = "=1.18.1"

# Windows-only: single-instance named mutex + foreground/restore
# (M-5/A1). The `windows` crate does not compile on Linux.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
