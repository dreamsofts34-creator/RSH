[package]
name = "rsh-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RSH v2.0 always-on daemon: engine + transport + output + tray + auto profile switch, no web engine. Runs headless; the Slint UI (Phase 3) attaches over local IPC."
publish = false

[[bin]]
name = "rsh-daemon"
path = "src/main.rs"

[dependencies]
rsh-api = { path = "../rsh-api" }
rsh-app-core = { path = "../rsh-app-core" }
rsh-ipc = { path = "../rsh-ipc" }
rsh-transport = { path = "../rsh-transport" }
dirs.workspace = true
serde_json.workspace = true
slint = "=1.18.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

[target.'cfg(windows)'.dependencies]
# Phase 7 tray: Win32_UI_Shell (Shell_NotifyIconGetRect) +
# Win32_UI_WindowsAndMessaging (FindWindowExW / foreground poll /
# work area) for the popup anchor, Win32_System_Registry for the
# Run-key autostart store (direct API — no reg.exe console flash).
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "=1.18.1"

[lints]
workspace = true
