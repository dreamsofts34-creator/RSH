[package]
name = "rsh-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The `windows` crate does NOT compile on Linux (windows-future 0.3.2 fails
# with 12 errors — reproduced in the F1 spike),
# so it must stay a Windows-only dependency: Linux builds never compile it.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp"] }
