# RSH — Build + Release
# Tag push (v* / fw-v*) par chalta hai, ya Actions tab se manual.
# Banata hai: ESP32 firmware bins + RSH Windows app (zip) -> GitHub Release.
name: Build and Release

on:
  push:
    # App tags vX.Y.Z hain (masalan v2.0.0), firmware tags fw-vX.Y.Z
    # (masalan fw-v4.0.0, D27) — fw-v* sirf "v*" se match nahi karta,
    # is liye dono patterns lazmi hain.
    tags: ["v*", "fw-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (jaise v2.0.2)"
        required: true
        default: "v2.0.2"

permissions:
  contents: write

jobs:
  firmware:
    name: Firmware (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ hashFiles('firmware/rsh/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install -U platformio
      # SEC-H-03 (Phase H): release kabhi unsigned ship nahi karti.
      # Ed25519 release private key GitHub secret RSH_SIGNING_KEY_PEM mein
      # hai (poori PEM content — repo Settings -> Secrets and variables ->
      # Actions; key kabhi repo mein nahi — KEY-LIFECYCLE.md §9). Secret
      # missing/empty ho to job FAIL hogi (fail closed — unsigned build
      # release mein nahi jata). Key sirf is job ke temp file mein rehti
      # hai (0600) aur step ke aakhir mein mit jati hai; CI log mein
      # kabhi print nahi hoti.
      - name: Build firmware (signed)
        working-directory: firmware/rsh
        env:
          RSH_SIGNING_KEY_PEM: ${{ secrets.RSH_SIGNING_KEY_PEM }}
        run: |
          if [ -z "$RSH_SIGNING_KEY_PEM" ]; then
            echo "MISSING SECRET: RSH_SIGNING_KEY_PEM set nahi — release signing ke baghair build nahi hoga (SEC-H-03)."
            exit 1
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s' "$RSH_SIGNING_KEY_PEM" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          RSH_SIGNING_KEY="$KEY_FILE" pio run
      - name: Check merged factory bin + SIGNED bin EXISTS (silent-merge bug guard + SEC-H-03)
        # merge_bin.py (post: script) koi input missing ho to stderr par
        # "skipping merge" likh kar KHAMOSHI se return karta hai — pio run
        # phir bhi green rehta hai aur merged bin bane baghair reh jata hai.
        # Is liye yahan merged bin ka existence check LAZMI hai: agar
        # RSH-Firmware-DevKitV1-v*.bin na bana ho to job FAIL hogi.
        # (CI workflow ci.yml se copy — wahi guard.)
        # SEC-H-03: firmware-signed.bin bhi LAZMI hai aur raw firmware.bin
        # se exactly 68 bytes bara hona chahiye (64 B signature + "RSHS").
        # Signed bin na ho ya size ghalat ho to job FAIL — unsigned image
        # release mein kabhi nahi jati.
        run: |
          BUILD_DIR="firmware/rsh/.pio/build/esp32dev"
          ls -la "$BUILD_DIR"
          test -f "$BUILD_DIR/firmware.bin" || { echo "MISSING: firmware.bin (app-only OTA image)"; exit 1; }
          test -f "$BUILD_DIR/firmware-signed.bin" || { echo "MISSING: firmware-signed.bin — signing step nahi chala (RSH_SIGNING_KEY set tha?)"; exit 1; }
          RAW_SIZE=$(stat -c%s "$BUILD_DIR/firmware.bin")
          SIGNED_SIZE=$(stat -c%s "$BUILD_DIR/firmware-signed.bin")
          if [ "$SIGNED_SIZE" -ne $((RAW_SIZE + 68)) ]; then
            echo "BAD SIZE: firmware-signed.bin $SIGNED_SIZE bytes, expected $RAW_SIZE + 68 = $((RAW_SIZE + 68))"
            exit 1
          fi
          if [ "$(tail -c 4 "$BUILD_DIR/firmware-signed.bin")" != "RSHS" ]; then
            echo "BAD TRAILER: firmware-signed.bin ke aakhri 4 bytes 'RSHS' nahi"
            exit 1
          fi
          echo "Signed bin OK: firmware-signed.bin ($SIGNED_SIZE bytes = firmware.bin + 68)"
          # BUG-W1-1 (Phase H W10): size+trailer kaafi nahi — cryptographic
          # verify + hash compare lazmi hain, warna purani version ki
          # (valid signature wali) stale signed image bhi pass ho jati.
          # (a) sign-image.py --verify, public key firmware mein baked
          #     signing_pubkey.h se (board jis key par trust karta hai,
          #     wahi) — signature ghalat ho ya key mismatch ho to FAIL.
          # (b) signed-region (pehle RAW_SIZE bytes) ka SHA-256
          #     firmware.bin se milna lazmi — stale signed bin FAIL.
          PUB_DER="$(mktemp)"; PUB_PEM="$(mktemp)"
          trap 'rm -f "$PUB_DER" "$PUB_PEM"' EXIT
          python3 -c "import re,sys; hdr=open('firmware/rsh/signing_pubkey.h').read(); raw=bytes(int(x,16) for x in re.findall(r'0x([0-9a-fA-F]{2})',hdr)); assert len(raw)==32, 'signing_pubkey.h: 32 bytes chahiye'; open(sys.argv[1],'wb').write(bytes.fromhex('302a300506032b6570032100')+raw); print('pubkey DER likha (32 bytes raw Ed25519 key)')" "$PUB_DER"
          openssl pkey -pubin -inform DER -in "$PUB_DER" -out "$PUB_PEM"
          python3 firmware/rsh/sign-image.py --verify "$PUB_PEM" "$BUILD_DIR/firmware-signed.bin"
          RAW_SHA=$(sha256sum "$BUILD_DIR/firmware.bin" | cut -d' ' -f1)
          SIGNED_SHA=$(head -c "$RAW_SIZE" "$BUILD_DIR/firmware-signed.bin" | sha256sum | cut -d' ' -f1)
          if [ "$RAW_SHA" != "$SIGNED_SHA" ]; then
            echo "STALE SIGNED BIN: firmware-signed.bin ka signed region firmware.bin se match nahi karta"
            echo "  firmware.bin SHA-256:        $RAW_SHA"
            echo "  signed-region SHA-256:       $SIGNED_SHA"
            echo "  (purani version ki signed image — dobara sign karo)"
            exit 1
          fi
          echo "Signed bin VERIFIED: signature OK (baked pubkey) + signed-region hash == firmware.bin"
          MERGED=$(ls "$BUILD_DIR"/RSH-Firmware-DevKitV1-v*.bin 2>/dev/null | head -n 1)
          if [ -z "$MERGED" ]; then
            echo "MISSING: merged factory bin RSH-Firmware-DevKitV1-v*.bin — merge_bin.py khamoshi se fail hua?"
            exit 1
          fi
          echo "Merged factory bin OK: $MERGED"
      - name: Checksums (release set only — raw bins NAHI)
        # SEC-H-03 / BUG-W1-1: release set sirf firmware-signed.bin +
        # merged factory bin hai. Raw firmware.bin pehle hi hata diya gaya
        # tha; bootloader.bin + partitions.bin bhi release asset NAHI
        # hain (BUG-W1-1, checklist §5(b)) — merged factory bin mein
        # teeno byte-exact maujood hain (bootloader @0x1000, partitions
        # @0x8000, app @0x10000 — verify: merge_bin.py + local check),
        # is liye factory flash ke liye alag raw bins ki zaroorat nahi.
        working-directory: firmware/rsh/.pio/build/esp32dev
        run: |
          sha256sum firmware-signed.bin RSH-Firmware-DevKitV1-v*.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          # SEC-H-03 / BUG-W1-1: raw firmware.bin yahan NAHI — unsigned
          # OTA image kabhi artifact/release mein nahi jati. Raw
          # bootloader.bin + partitions.bin bhi NAHI — merged factory
          # bin mein teeno hain (checklist §5(b)).
          path: |
            firmware/rsh/.pio/build/esp32dev/firmware-signed.bin
            firmware/rsh/.pio/build/esp32dev/RSH-Firmware-DevKitV1-v*.bin
            firmware/rsh/.pio/build/esp32dev/SHA256SUMS.txt

  software:
    name: RSH app (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # software/global.json bhi 10.0.100 pin karta hai
          # (rollForward latestPatch); yahan explicit pin taake
          # global.json ke baghair bhi SDK wahi rahe — ye step repo
          # root par chalta hai, jahan global.json maujood nahi hai.
          dotnet-version: "10.0.100"
      - name: Verify SDK pin matches global.json
        shell: pwsh
        run: |
          $sdk = (dotnet --version).Trim()
          $pinned = (Get-Content software/global.json | ConvertFrom-Json).sdk.version
          Write-Host "SDK: $sdk, global.json pin: $pinned"
          # NOTE (2026-11-13): ye check pehle exact-equality tha, lekin
          # global.json mein rollForward latestPatch hai — runner par naye
          # patches preinstalled hote hain, is liye dotnet --version pin se
          # naya de sakta hai. Pin minimum version hai, exact nahi.
          if ([System.Version]$sdk -lt [System.Version]$pinned) { throw "SDK $sdk < global.json pin $pinned" }
      # Har test project apne step mein (CI jaisa breakdown) — xUnit v3/MTP
      # console par fail hone wale test ka naam NAHI chhapta, is liye har
      # step `--report-xunit-trx` se TRX likhta hai; fail hone par
      # "Upload test results" step use artifact ke tor par upload karta hai.
      - name: Test RSH.Tests (Core)
        working-directory: software
        run: dotnet test tests/RSH.Tests/RSH.Tests.csproj -c Release --nologo -- --report-xunit-trx --report-xunit-trx-filename RSH.Tests.trx --results-directory ${{ github.workspace }}/test-results

      - name: Test RSH.VJoy.Tests (vJoy layout)
        working-directory: software
        run: dotnet test tests/RSH.VJoy.Tests/RSH.VJoy.Tests.csproj -c Release --nologo -- --report-xunit-trx --report-xunit-trx-filename RSH.VJoy.Tests.trx --results-directory ${{ github.workspace }}/test-results

      - name: Test RSH.HIDMaestro.Tests (experimental backend)
        working-directory: software
        run: dotnet test tests/RSH.HIDMaestro.Tests/RSH.HIDMaestro.Tests.csproj -c Release --nologo -- --report-xunit-trx --report-xunit-trx-filename RSH.HIDMaestro.Tests.trx --results-directory ${{ github.workspace }}/test-results

      - name: Test RSH.App.Tests (app services)
        working-directory: software
        run: dotnet test tests/RSH.App.Tests/RSH.App.Tests.csproj -c Release --nologo -- --report-xunit-trx --report-xunit-trx-filename RSH.App.Tests.trx --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results-release
          path: test-results/*.trx
          if-no-files-found: warn
      - name: Publish app
        # v2.0.1 HOTFIX (W2): framework-dependent LOOSE publish.
        # User faisla 2026-11-13: .NET runtime zip se NIKALO (user ke PC par
        # .NET pehle se installed hai) + zip organized rakho — v2.0.0
        # self-contained zip mein 150+ files flat thin (~83 MB).
        # --self-contained false: sirf app ki managed assemblies + apphost
        # publish hoti hain; .NET runtime user ke PC se aata hai.
        # Single-file NAHI (user faisla — akeli RSH.exe mein sab pack hoga
        # to heavy ho jayegi): LOOSE publish — halki RSH.exe + DLLs saath.
        # WPF app hai — is ke liye user ke PC par .NET 10 DESKTOP Runtime
        # chahiye hota hai, sirf base runtime nahi; release notes mein ye
        # requirement saaf likhni hai (W3).
        working-directory: software
        run: >
          dotnet publish src/RSH.App/RSH.App.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/RSH
      - name: Zip app
        shell: pwsh
        run: |
          if (-not (Test-Path software/publish/RSH/RSH.exe)) { throw "RSH.exe missing after publish — publish fail hua?" }
          Compress-Archive -Path software/publish/RSH/* -DestinationPath RSH-windows-x64.zip
          Write-Host "Zip contents (framework-dependent loose — runtime DLLs nahi, sirf app files expected):"
          (Get-ChildItem software/publish/RSH/ | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1MB,2)) MB" }) | Out-Host
          Get-FileHash RSH-windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  RSH-windows-x64.zip" } |
            Out-File -Encoding ascii SHA256SUMS-app.txt
      - name: Publish render test
        # v2.0.2 (C1): RSH.RenderTest — plain WPF Window + Button, ZERO
        # NuGet deps (framework-only). Blank-window diagnostic tool:
        # agar ye bhi blank ho to masla GPU/OS level hai, RSH code mein
        # nahi. Alag zip asset banta hai (main zip ke ANDAR nahi — user
        # ka organized-zip rule). Framework-dependent loose, app jaisa.
        working-directory: software
        run: >
          dotnet publish src/RSH.RenderTest/RSH.RenderTest.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/RSH.RenderTest
      - name: Zip render test
        shell: pwsh
        run: |
          if (-not (Test-Path software/publish/RSH.RenderTest/RSH.RenderTest.exe)) { throw "RSH.RenderTest.exe missing after publish — publish fail hua?" }
          Compress-Archive -Path software/publish/RSH.RenderTest/* -DestinationPath RSH-render-test-x64.zip
          Write-Host "RenderTest zip contents (5 files expected, zero NuGet deps):"
          (Get-ChildItem software/publish/RSH.RenderTest/ | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1KB,1)) KB" }) | Out-Host
          Get-FileHash RSH-render-test-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  RSH-render-test-x64.zip" } |
            Out-File -Encoding ascii -Append SHA256SUMS-app.txt
      - uses: actions/upload-artifact@v4
        with:
          name: software
          path: |
            RSH-windows-x64.zip
            RSH-render-test-x64.zip
            SHA256SUMS-app.txt

  release:
    name: GitHub Release
    needs: [firmware, software]
    runs-on: ubuntu-latest
    steps:
      # Checkout lazmi hai: gh release create --target "$GITHUB_SHA" ko
      # usi commit par tag lagana hai jis par ye workflow chala — baghair
      # checkout/target ke dispatch par release default branch ke HEAD
      # par lagti, jo galat commit ho sakta hai.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Re-run behaviour: agar is tag ki release pehle se maujood ho to
      # `gh release create` "already exists" par FAIL hogi — ye EXPECTED
      # hai (purani release ko khamoshi se overwrite/clobber nahi karna).
      # Dobara release ke liye pehle purani release delete karo, phir
      # workflow dobara chalao.
      - name: Create release + upload files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          ls -R artifacts
          # SEC-H-03 / BUG-W1-1: OTA image SIRF firmware-signed.bin hai —
          # raw (unsigned) firmware.bin kabhi release asset nahi banti.
          # Raw bootloader.bin + partitions.bin bhi NAHI — merged
          # factory bin mein teeno hain (checklist §5(b)).
          # Is liye yahan explicit file list hai, `*.bin` glob nahi.
          test -f artifacts/firmware/firmware-signed.bin || { echo "MISSING: firmware-signed.bin artifact"; exit 1; }
          if [ -f artifacts/firmware/firmware.bin ]; then
            echo "UNEXPECTED: raw firmware.bin artifact mein hai — unsigned image release mein nahi jani chahiye"
            exit 1
          fi
          for f in bootloader.bin partitions.bin; do
            if [ -f "artifacts/firmware/$f" ]; then
              echo "UNEXPECTED: raw $f artifact mein hai — merged factory bin mein ye pehle se hai (checklist §5(b))"
              exit 1
            fi
          done
          gh release create "$TAG" --target "$GITHUB_SHA" --title "RSH $TAG" --notes-file docs/RELEASE-NOTES-v2.0.2.md \
            artifacts/firmware/firmware-signed.bin \
            artifacts/firmware/RSH-Firmware-DevKitV1-v*.bin \
            artifacts/firmware/SHA256SUMS.txt \
            artifacts/software/RSH-windows-x64.zip \
            artifacts/software/RSH-render-test-x64.zip \
            artifacts/software/SHA256SUMS-app.txt
