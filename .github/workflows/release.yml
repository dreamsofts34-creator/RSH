# RSH Rust — Release (Phase H, SW-R8.4 / SW-R8.5)
#
# PREP ONLY — this workflow has never run. The parent (coordinator) executes the
# release by pushing a tag `v1.*` AFTER the Phase H gate is green. Nothing in this
# file runs on a normal push to main (CI covers that).
#
# What it does, in order (every step fail-closed — a missing asset, a bad
# signature, or a version mismatch fails the run, never a silent partial release):
#   1. Gates: `cargo test --workspace`, `cargo deny check`, frontend tests + build.
#   2. Firmware: PlatformIO build of `firmware/` (C++ v4.0.1) + Ed25519 signing
#      with the `RSH_SIGNING_KEY_PEM` secret + fail-closed verify
#      (`sign-image.py --verify` + image-region == `firmware.bin` + size check).
#   3. Sidecar: fetch HIDMaestro v2.1.0, verify ZIP + DLL SHA-256, `dotnet publish`
#      NativeAOT win-x64, stage as `src-tauri/binaries/rsh-hm-sidecar-x86_64-pc-windows-msvc.exe`
#      (Tauri `bundle.externalBin` — lands beside RSH.exe).
#   4. SBOMs regenerated fresh (`cargo cyclonedx`, `npm sbom`; sidecar SBOM is
#      hand-written, re-verified against docs/HIDMAESTRO-SPIKE.md pins).
#   5. `cargo tauri build` — NSIS + MSI installers, updater `.sig` artifacts
#      (signed with the `RSH_UPDATER_PRIVATE_KEY` secret via TAURI_SIGNING_PRIVATE_KEY).
#   6. `latest.json` (updater manifest) generated from the real `.sig` contents +
#      the real GitHub release download URLs. `SHA256SUMS` over every asset.
#   7. Verify pass over the staged assets, then `gh release create` (skipped on dry-run).
#   8. The temp firmware signing-key file is deleted in an `if: always()` step.
#
# PREREQUISITES (human gates — NOT checked by this workflow, see docs/RELEASE-CHECKLIST-H4.md):
#   * `firmware/` restored in the repo from `reference/firmware-v4.0.1/` (Phase D).
#     If it is absent, this workflow FAILS with instructions (it never builds a
#     firmware-less release).
#   * pid.codes PR claiming VID 0x1209 / PID 0x5253 merged (Phase G gate, D-G3).
#   * vJoy DLL SHA-256 measured on a Windows machine and filled into
#     `PINNED_DLL_SHA256_HEX` (Phase G gate, G-G3) — this workflow only records
#     whether the runner happens to have vJoy installed (it will not).
#   * Secrets present in the repo settings: `RSH_SIGNING_KEY_PEM` (whole Ed25519
#     private-key PEM), `RSH_UPDATER_PRIVATE_KEY` (whole minisign private-key file
#     for the Tauri updater — generated by H4, stored in signing-keys/ OUTSIDE the repo).
#   * App ships UNSIGNED (OV cert deferred, D-R11). Firmware signing is unaffected.
#
# Release assets (exact list — see docs/RELEASE-CHECKLIST-H4.md §7):
#   RSH_1.0.0_x64-setup.exe            (NSIS installer — primary)
#   RSH_1.0.0_x64-setup.exe.sig        (updater signature for the NSIS installer)
#   RSH_1.0.0_x64_en-US.msi           (MSI installer — secondary)
#   RSH_1.0.0_x64_en-US.msi.sig        (updater signature for the MSI)
#   latest.json                        (updater manifest — published with the release)
#   RSH-Firmware-DevKitV1-v4.0.1.bin   (merged factory firmware image)
#   firmware-signed.bin                (signed app-only image, firmware.bin + 68 B trailer)
#   SHA256SUMS                         (SHA-256 of every asset above)
#   sbom-rust.cdx.json, sbom-frontend.cdx.json, sbom-sidecar.cdx.json
#
# Note on the CI `tauri-build` job: H4 found it ran `npm run tauri build`
# in `frontend/`, but there is no `tauri` npm script and no
# `@tauri-apps/cli` in `frontend/package.json`, so that job could not work
# as written. H5 fixed it the same way this workflow does it: the CI job
# now installs the CLI with `cargo install tauri-cli --locked` and runs
# `cargo tauri build --no-bundle` from `src-tauri/`.

name: RSH Rust — Release

on:
  push:
    tags:
      - "v1.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + verify everything, but do not create the GitHub Release"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tag:
        description: "Tag to release (workflow_dispatch only, e.g. v1.0.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  release:
    name: release
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          elseif ("${{ inputs.tag }}" -ne "") { $tag = "${{ inputs.tag }}" }
          else { Write-Error "No tag: push a v1.* tag or pass inputs.tag."; exit 1 }
          if ($tag -notmatch '^v1\.\d+\.\d+$') { Write-Error "Tag '$tag' is not v1.x.y."; exit 1 }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

      - name: Tag matches Cargo workspace version
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.version }}"
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version = "' + [regex]::Escape($version) + '"') {
            Write-Error "Tag version $version does not match [workspace.package] version in Cargo.toml."
            exit 1
          }
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($conf.version -ne $version) { Write-Error "tauri.conf.json version $($conf.version) != $version."; exit 1 }
          if ($conf.bundle.createUpdaterArtifacts -ne $true) { Write-Error "bundle.createUpdaterArtifacts must be true for a release build."; exit 1 }
          Write-Host "Version $version consistent across Cargo.toml and tauri.conf.json."

      - name: Firmware source present (fail closed)
        shell: pwsh
        run: |
          foreach ($f in @("firmware/platformio.ini", "firmware/sign_firmware.py", "firmware/sign-image.py", "firmware/rsh/signing_pubkey.h")) {
            if (-not (Test-Path $f)) {
              Write-Error "Missing $f — firmware/ is not restored in the repo. Restore it from reference/firmware-v4.0.1/ (Phase D) before tagging. A firmware-less release is never built."
              exit 1
            }
          }
          Write-Host "Firmware source present."

      - name: Secrets present (fail closed)
        shell: pwsh
        run: |
          if ("${{ secrets.RSH_SIGNING_KEY_PEM }}" -eq "") { Write-Error "Secret RSH_SIGNING_KEY_PEM is not set (firmware Ed25519 private key PEM)."; exit 1 }
          if ("${{ secrets.RSH_UPDATER_PRIVATE_KEY }}" -eq "") { Write-Error "Secret RSH_UPDATER_PRIVATE_KEY is not set (Tauri updater minisign private key)."; exit 1 }
          Write-Host "Both signing secrets are present (values never printed)."

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install PlatformIO + cargo tools
        shell: pwsh
        run: |
          pip install -U platformio
          cargo install cargo-cyclonedx cargo-deny --locked
          cargo install tauri-cli --locked
          cargo tauri --version

      # ---- Gates (same gates CI runs on main; a tag push does not trigger CI) ----
      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo deny check
        run: cargo deny check

      - name: Frontend tests + build
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          npm test
          npm run build

      # ---- Firmware: build + sign + fail-closed verify ----
      - name: Write firmware signing key to temp file (deleted in `always()` step)
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "rsh-signing-key.pem"
          "${{ secrets.RSH_SIGNING_KEY_PEM }}" | Out-File -FilePath $keyPath -Encoding ascii -NoNewline
          "RSH_SIGNING_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
          Write-Host "Signing key written to temp file (path only, never printed)."

      - name: PlatformIO build (signed — RSH_SIGNING_KEY set)
        working-directory: firmware
        shell: pwsh
        env:
          RSH_SIGNING_KEY: ${{ env.RSH_SIGNING_KEY_PATH }}
        run: pio run

      - name: Verify signed firmware (fail closed)
        working-directory: firmware
        shell: pwsh
        run: |
          $buildDir = ".pio/build/esp32dev"
          $merged = Get-ChildItem "$buildDir/RSH-Firmware-DevKitV1-v*.bin" -ErrorAction SilentlyContinue
          if ($merged.Count -ne 1) { Write-Error "Expected exactly one merged bin in $buildDir."; exit 1 }
          if ($merged[0].Length -ne 955056) { Write-Warning "Merged bin size is $($merged[0].Length) B, expected 955056 B (v4.0.1). Recorded, not failed — size changes only with a firmware change." }
          $app = "$buildDir/firmware.bin"
          $signed = "$buildDir/firmware-signed.bin"
          if (-not (Test-Path $signed)) { Write-Error "firmware-signed.bin missing — signing did not run (RSH_SIGNING_KEY unset or sign step failed). An unsigned release is never published."; exit 1 }
          $appSize = (Get-Item $app).Length
          $signedSize = (Get-Item $signed).Length
          if ($signedSize -ne ($appSize + 68)) { Write-Error "firmware-signed.bin is $signedSize B, expected $appSize + 68."; exit 1 }
          # Image region of the signed file must be byte-identical to the fresh firmware.bin
          # (guards against a stale signed bin surviving from an earlier build).
          python -c "import sys; a=open(r'$app','rb').read(); b=open(r'$signed','rb').read(); sys.exit(0 if b[:-68]==a else 1)"
          if ($LASTEXITCODE -ne 0) { Write-Error "Signed image region != fresh firmware.bin (stale signed bin)."; exit 1 }
          # Signature verify (Ed25519 over SHA-256 of the image, 68 B trailer). Non-zero exit fails.
          python sign-image.py --verify $env:RSH_SIGNING_KEY_PATH $signed
          Write-Host "Firmware signed + verified: $($merged[0].Name) + firmware-signed.bin."

      # ---- Sidecar: fetch pinned HIDMaestro, verify hashes, AOT publish ----
      - name: Fetch + verify HIDMaestro v2.1.0, publish sidecar (AOT)
        shell: pwsh
        run: |
          $zipUrl = "https://github.com/hifihedgehog/HIDMaestro/releases/download/v2.1.0/HIDMaestro-v2.1.0.zip"
          $zip = Join-Path $env:RUNNER_TEMP "HIDMaestro-v2.1.0.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($zipHash -ne "7fe349f163864b8dfc36117af260d51bac94a2263b6cdfa719cb364a808397b4") { Write-Error "HIDMaestro ZIP SHA-256 mismatch: $zipHash"; exit 1 }
          $dllDir = Join-Path $env:RUNNER_TEMP "hidmaestro"
          Expand-Archive $zip -DestinationPath $dllDir -Force
          $dll = Get-ChildItem -Recurse $dllDir -Filter "HIDMaestro.Core.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "HIDMaestro.Core.dll not found in the release ZIP."; exit 1 }
          $dllHash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLower()
          if ($dllHash -ne "f13e32591404db0f418af9265b8e240f71257297cfae5a41dcd696fd87e9b4d5") { Write-Error "HIDMaestro.Core.dll SHA-256 mismatch: $dllHash"; exit 1 }
          dotnet publish tools/rsh-hm-sidecar/rsh-hm-sidecar.csproj -c Release -r win-x64 -p:PublishAot=true -p:HidMaestroDllPath=$($dll.FullName)
          $exe = "tools/rsh-hm-sidecar/bin/Release/net10.0-windows/win-x64/publish/rsh-hm-sidecar.exe"
          if (-not (Test-Path $exe)) { Write-Error "Sidecar AOT publish produced no exe at $exe."; exit 1 }
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item $exe "src-tauri/binaries/rsh-hm-sidecar-x86_64-pc-windows-msvc.exe"
          Write-Host "Sidecar staged for Tauri externalBin."

      # ---- SBOMs regenerated fresh ----
      - name: Regenerate SBOMs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-staging" | Out-Null
          # cargo-cyclonedx writes bom.json next to the workspace Cargo.toml
          # (one file per Cargo.toml; --format json selects JSON). There is no
          # --output-file flag — copy the root bom.json to the staging name.
          cargo cyclonedx --format json
          if (-not (Test-Path "bom.json")) { Write-Error "cargo cyclonedx produced no bom.json at the workspace root."; exit 1 }
          Copy-Item bom.json release-staging/sbom-rust.cdx.json
          Push-Location frontend
          npm sbom --sbom-format cyclonedx --sbom-version 1.6 > ../release-staging/sbom-frontend.cdx.json
          Pop-Location
          Copy-Item sbom/sidecar.cdx.json release-staging/sbom-sidecar.cdx.json
          Write-Host "SBOMs regenerated (sidecar SBOM is hand-written; pins re-verified above)."

      # ---- Tauri build (NSIS + MSI + updater .sig) ----
      - name: cargo tauri build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.RSH_UPDATER_PRIVATE_KEY }}
        run: cargo tauri build --target x86_64-pc-windows-msvc
        working-directory: src-tauri

      # ---- Stage assets, latest.json, SHA256SUMS, verify ----
      - name: Stage release assets
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $version = "${{ steps.tag.outputs.version }}"
          $bundleDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $nsis = Get-ChildItem "$bundleDir/nsis/*-setup.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem "$bundleDir/msi/*.msi" -ErrorAction SilentlyContinue
          if ($nsis.Count -ne 1) { Write-Error "Expected exactly one NSIS setup exe in $bundleDir/nsis."; exit 1 }
          if ($msi.Count -ne 1) { Write-Error "Expected exactly one MSI in $bundleDir/msi."; exit 1 }
          $nsisSig = "$($nsis.FullName).sig"; $msiSig = "$($msi.FullName).sig"
          if (-not (Test-Path $nsisSig)) { Write-Error "Missing updater signature: $nsisSig (createUpdaterArtifacts must be true and TAURI_SIGNING_PRIVATE_KEY set)."; exit 1 }
          if (-not (Test-Path $msiSig)) { Write-Error "Missing updater signature: $msiSig."; exit 1 }
          $staging = "release-staging"
          Copy-Item $nsis.FullName "$staging/$($nsis.Name)"
          Copy-Item $nsisSig "$staging/$($nsis.Name).sig"
          Copy-Item $msi.FullName "$staging/$($msi.Name)"
          Copy-Item $msiSig "$staging/$($msi.Name).sig"
          # Firmware version is 4.0.1 (NOT the app version) — glob the merged bin.
          $merged = Get-ChildItem "firmware/.pio/build/esp32dev/RSH-Firmware-DevKitV1-v*.bin" | Select-Object -First 1
          Copy-Item $merged.FullName "$staging/$($merged.Name)"
          Copy-Item "firmware/.pio/build/esp32dev/firmware-signed.bin" "$staging/firmware-signed.bin"
          # latest.json — generated from the real .sig contents + real release URLs.
          # (The bundler also writes a latest.json; this one is authoritative because
          # the download URL must be the GitHub release URL, which only exists now.)
          $nsisSigText = (Get-Content $nsisSig -Raw).Trim()
          $baseUrl = "https://github.com/dreamsofts34-creator/RSH/releases/download/$tag"
          $latest = @{
            version = $version
            notes = "RSH v$version — see the GitHub Release notes."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $nsisSigText; url = "$baseUrl/$($nsis.Name)" } }
          }
          $latest | ConvertTo-Json -Depth 5 | Out-File "$staging/latest.json" -Encoding utf8
          # SHA256SUMS over every staged asset (deterministic order, two-column format).
          $lines = Get-ChildItem $staging -File | Where-Object { $_.Name -ne "SHA256SUMS" } | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Out-File "$staging/SHA256SUMS" -Encoding ascii
          Write-Host "Staged assets:"; Get-ChildItem $staging -File | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) B)" }

      - name: Verify staged assets (fail closed)
        shell: pwsh
        run: |
          $staging = "release-staging"
          $expected = @("latest.json", "SHA256SUMS", "firmware-signed.bin", "sbom-rust.cdx.json", "sbom-frontend.cdx.json", "sbom-sidecar.cdx.json")
          foreach ($f in $expected) { if (-not (Test-Path "$staging/$f")) { Write-Error "Missing staged asset: $f"; exit 1 } }
          if ((Get-ChildItem "$staging/*-setup.exe").Count -ne 1) { Write-Error "Missing NSIS setup exe in staging."; exit 1 }
          if ((Get-ChildItem "$staging/*.msi").Count -ne 1) { Write-Error "Missing MSI in staging."; exit 1 }
          if ((Get-ChildItem "$staging/RSH-Firmware-DevKitV1-v*.bin").Count -ne 1) { Write-Error "Missing merged firmware bin in staging."; exit 1 }
          $latest = Get-Content "$staging/latest.json" -Raw | ConvertFrom-Json
          if (-not $latest.platforms."windows-x86_64".signature) { Write-Error "latest.json has no Windows signature."; exit 1 }
          if (-not $latest.platforms."windows-x86_64".url) { Write-Error "latest.json has no Windows URL."; exit 1 }
          # SHA256SUMS re-verification (recompute every entry).
          Push-Location $staging
          foreach ($line in (Get-Content SHA256SUMS)) {
            $h, $name = $line -split '\s+', 2
            $actual = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $h) { Write-Error "SHA256SUMS mismatch for $name."; exit 1 }
          }
          Pop-Location
          # Re-verify the staged signed firmware with the temp public key derived from the secret.
          python firmware/sign-image.py --verify $env:RSH_SIGNING_KEY_PATH "$staging/firmware-signed.bin"
          Write-Host "All staged assets verified."

      - name: vJoy DLL hash (record only — never invented)
        shell: pwsh
        run: |
          $dll = Get-ChildItem "C:\Program Files*\vJoy\vJoyInterface.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { Write-Host "vJoy DLL found on runner: $(Get-FileHash $dll.FullName -Algorithm SHA256).Hash — record it in PINNED_DLL_SHA256_HEX (G-G3) if it matches the release machine." }
          else { Write-Host "vJoy is not installed on the runner (expected). PINNED_DLL_SHA256_HEX stays None until measured on the Windows release machine (G-G3) — never invented." }

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.dry_run == 'false' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          gh release create $tag --title "RSH v${{ steps.tag.outputs.version }}" --notes "RSH v${{ steps.tag.outputs.version }} — Tauri 2 app (NSIS + MSI) + C++ firmware v4.0.1 (signed). See docs/RELEASE-CHECKLIST-H4.md. App ships unsigned (OV cert deferred, D-R11); firmware is Ed25519-signed and verified." release-staging/*

      - name: Dry run — release NOT created
        if: ${{ github.ref_type != 'tag' && inputs.dry_run != 'false' }}
        shell: pwsh
        run: Write-Host "Dry run complete — assets verified in release-staging/, no GitHub Release created."

      - name: Delete temp firmware signing key (always)
        if: always()
        shell: pwsh
        run: |
          if ($env:RSH_SIGNING_KEY_PATH -and (Test-Path $env:RSH_SIGNING_KEY_PATH)) {
            Remove-Item $env:RSH_SIGNING_KEY_PATH -Force
            Write-Host "Temp signing key deleted."
          }
