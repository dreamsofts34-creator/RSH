# RSH v2.0 — Release (THREE-ASSET, daemon + Slint UI)
#
# THREE-ASSET RELEASE (user orders 2026-11-16 ~20:20 + 2026-11-17
# ~07:48 — supersedes the 2026-11-15 exe-only rule): the release contains EXACTLY THREE assets:
#   1. NSIS installer `RSH_<version>_x64-setup.exe`
#   2. Merged full-flash firmware `RSH-Firmware-DevKitV1-<version>.bin`
#      (factory image, flash at 0x0)
#   3. Signed OTA firmware `RSH-Firmware-DevKitV1-<version>-OTA.bin`
#      (Ed25519-signed app image — `firmware-signed.bin` — the image
#      the app's WebOTA flow flashes to the board)
# Nothing else is staged or uploaded: no MSI, no `.sig` files, no
# `latest.json`, no `SHA256SUMS`, no SBOMs. Auto-update is OFF: no
# `latest.json` is published, users install by downloading the exe
# manually.
#
# v2.0 architecture (REDESIGN-PLAN): the SHIPPED app has no Tauri shell
# anymore — the installer ships Slint rsh-ui + rsh-daemon only.
# (DS-71: src-tauri/ + frontend/ still EXIST in the repo, kept-but-
# unshipped — see the note under 'REMOVED' below. The Tauri shell is
# still built by CI's tauri-build job, and its src-tauri/binaries/
# dir is still the staging place for the HIDMaestro sidecar exe.)
# The installer bundles two binaries + the HIDMaestro sidecar, all in
# one install dir:
#   rsh-daemon.exe            always-on daemon (engine + transport +
#                             output + tray + auto profiles)
#   rsh-ui.exe                Slint main window (spawned from the tray)
#   rsh-hm-sidecar.exe        HIDMaestro NativeAOT sidecar — MUST sit
#                             beside rsh-daemon.exe: the daemon resolves
#                             it as <own exe dir>/rsh-hm-sidecar.exe
#                             (rsh-output-hidmaestro `resolve_sidecar_path`)
# Firmware v4.0.2 IS shipped in this release (user orders 2026-11-16
# ~20:20 + 2026-11-17 ~07:48): BOTH firmware files, built + signed
# HERE on the runner from the tagged source (step 6 below) — never
# copied from a developer machine. The merged factory image is for
# USB/full-flash; the signed OTA image is what the app's WebOTA flow
# flashes (the board verifies the Ed25519 signature against the
# pubkey baked into firmware/signing_pubkey.h before applying it).
# (DS-13: the Verify step below cross-checks that baked pubkey
# against the pubkey derived from the RSH_SIGNING_KEY_PEM secret —
# a rotation that only one side knows about fails the release.)
# NOTE (honest): the WebOTA flow itself (app → board) has NOT been
# verified on the user's board yet — that stays a human gate.
#
# What it does, in order (every step fail-closed — a missing asset
# or a version mismatch fails the run, never a silent partial release):
#   1. Sidecar FIRST: fetch HIDMaestro v2.1.0, verify ZIP + DLL SHA-256,
#      `dotnet publish` NativeAOT win-x64 (shared script
#      `tools/ci/stage-sidecar.ps1`; it stages to
#      `src-tauri/binaries/…` — the v2.0 installer picks the exe up
#      from there; the Tauri shell itself is not built BY THIS
#      WORKFLOW (CI's tauri-build job still builds it — DS-71,
#      kept-but-unshipped).
#   2. Gates: `cargo fmt --check`, `cargo clippy --workspace
#      --exclude rsh-app` (Windows — every non-Tauri member),
#      `cargo test -p rsh-daemon -p rsh-ui -p rsh-api -p rsh-ipc
#      --release` (the ship crates, release mode — the one
#      release-only proof; the debug full suite is CI's job),
#      `cargo deny check`.
#   3. `cargo build --release -p rsh-daemon -p rsh-ui`.
#   4. PE-subsystem check: daemon + UI + sidecar must ALL be
#      GUI-subsystem (2) — a console-subsystem (3) binary would pop
#      a terminal window on launch (v1.0.0 lesson). NOTE: this check
#      FAILS until Phase 3 adds `windows_subsystem = "windows"` to
#      rsh-ui (the daemon already has it) — that is the check doing
#      its job, not a workflow bug.
#   5. NSIS installer: the `.nsi` script is generated by this
#      workflow (there is no committed installer script — the
#      installer IS this workflow's `installer/rsh.nsi` step), built
#      with `makensis`. The installer:
#        * requests admin ONCE at install time (`RequestExecutionLevel
#          admin`) — never at login;
#        * creates the program-scoped inbound UDP firewall rule for
#          rsh-daemon.exe (Private + Public, LOGIC-FIX-PLAN §4.3 /
#          C-10) via `netsh` (hidden, `nsExec`), and removes it on
#          uninstall;
#        * registers the WER LocalDumps keys for rsh-daemon.exe /
#          rsh-ui.exe (Round 3 WS-6, R3-AK-02 — native-crash dumps
#          to `%ProgramData%\RSH\dumps`, DumpCount 5) and removes
#          them on uninstall (the dumps themselves are kept, like
#          `%APPDATA%\RSH`);
#        * creates the "RSH Daemon" Task Scheduler supervisor task
#          (Round 3 WS-6, R3-AK-01 — logon trigger + restart on
#          failure, 1 min × 3) via `installer/rsh-task.ps1` (also
#          generated by this workflow), and removes it on uninstall;
#          the daemon never creates its own task at runtime;
#        * does NOT enable autostart: Settings owns that (the daemon
#          syncs the Run key / .desktop file from
#          `settings.autostart` on startup).
#   6. Firmware (v4.0.2): build with PlatformIO (`esp32dev` env),
#      sign the app image with the release Ed25519 key (GitHub secret
#      RSH_SIGNING_KEY_PEM — the private key never enters the repo),
#      verify the signature + version marker fail-closed, then stage
#      BOTH firmware assets into release-staging/ (merged factory
#      image + signed OTA image). The merged image is the full-flash
#      file; the OTA image is what the app's WebOTA flow flashes.
#   7. Stage + verify: exactly THREE files in release-staging/
#      (exe + merged + OTA), then `gh release create` with all three
#      (skipped on dry-run).
#   8. Headless launch smoke test: silently install the staged NSIS
#      exe, prove the firewall rule exists, run
#      `rsh-daemon --check --no-tray --no-connect` (exit 0 = IPC
#      answers), uninstall silently, prove the rule and the install
#      dir are gone. Cannot prove window paint on a headless runner
#      — process + IPC + rule is the strongest launch evidence in
#      CI; real paint stays a human gate.
#
# PREREQUISITES (human gates — NOT checked by this workflow):
#   * Workspace version bumped to the tag version (Cargo.toml
#     `[workspace.package]`): the tag check below FAILS CLOSED until
#     then — bump first, then tag.
#   * App ships UNSIGNED (OV cert deferred, D-R11).
#   * pid.codes PR for VID 0x1209 / PID 0x5253 merged (Phase G gate).
#   * vJoy DLL SHA-256 measured on a Windows machine (G-G3) — this
#     workflow only records whether the runner happens to have vJoy
#     installed (it will not).
#
# Release assets (exact list — THREE assets, as listed in this workflow's header):
#   RSH_2.0.2_x64-setup.exe            (NSIS installer — app version)
#   RSH-Firmware-DevKitV1-v4.0.3.bin    (merged full-flash firmware image — firmware version)
#   RSH-Firmware-DevKitV1-v4.0.3-OTA.bin (Ed25519-signed OTA image — firmware version)
#
# REMOVED in the v2.0 rewrite (2026-11-16) — these v1.x steps no longer
# exist in this file:
#   * `cargo tauri build` + the whole Tauri bundler path
#     (`src-tauri/tauri.conf.json` version/title/bundle-targets checks,
#     `createUpdaterArtifacts`, updater signing env, `.sig` handling)
#     — DS-71 note: src-tauri/ + frontend/ still EXIST in the repo
#     (the `rsh-app` workspace member, built by CI's tauri-build job)
#     but the v2.0 installer does NOT ship the Tauri bundle: it ships
#     the Slint `rsh-ui` + `rsh-daemon` binaries. The Tauri shell is
#     kept-but-unshipped; its `src-tauri/binaries/` dir is still the
#     staging place for the HIDMaestro sidecar exe (step below).
#   * Frontend gates (`frontend/` lint/tests/build) — the v2.0 UI is
#     the Slint `rsh-ui` crate; the `frontend/` React app is only the
#     Tauri shell's frontendDist (kept-but-unshipped, see above).
#   * `cargo test --workspace --release` (replaced by the four ship
#     crates; the full debug suite runs in CI, not here — user order:
#     no repeated full-suite loops)
#   * Firmware build/sign/verify + SBOM regeneration/verification
#     (the v2.0 rewrite removed them — nothing firmware/SBOM was
#     published in a v2.0/v2.0.1 release; firmware build + sign +
#     verify is RE-ADDED in v2.0.2 for the OTA asset, step 6 above.
#     SBOMs are still NOT published.)
#   * The v1.x headless smoke test that launched `RSH.exe` and waited
#     for "event loop ready" in `%APPDATA%\RSH\logs` (replaced by the
#     daemon `--check` + firewall-rule smoke test below)

name: RSH v2.0 — Release

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + verify everything, but do not create the GitHub Release"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tag:
        description: "Tag to release (workflow_dispatch only, e.g. v2.0.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  release:
    name: release
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # R3-18 (v2.0.7 release runs 44962668126 + 44967991529 both
      # failed at the PDB step): TWO causes, both fixed. (1) On
      # Windows-MSVC cargo's `strip` DELETES the .pdb files — with
      # [profile.release] strip = true, `debug = true` emits PDBs and
      # cargo then removes them. (2) The step looked for the WRONG
      # filenames: rustc names the PDB after the CRATE name
      # (underscores) — the CodeView record in the shipped v2.0.6
      # rsh-daemon.exe names `rsh_daemon.pdb`, not `rsh-daemon.pdb`
      # (same for rsh_ui.pdb). Run 44967991529 proved (2): strip was
      # already disabled (env in effect in every step dump, build
      # logged "[optimized + debuginfo]") and the step still failed.
      # The PDBs must come from the SAME compilation as the shipped
      # exes (GUID/Age fingerprint), so strip is disabled for this job
      # only via the documented CARGO_PROFILE_RELEASE_STRIP override
      # (verified: cargo honors the env var; the step below searches
      # for the real underscore names). CI/local builds keep
      # strip = true (Linux binary sizes + perf-gate limits are
      # measured with it). On Windows the shipped exes barely grow —
      # debuginfo lives in the PDB, not the exe — and the release
      # perf-gate below still enforces the size limits on the actual
      # shipped binaries.
      CARGO_PROFILE_RELEASE_STRIP: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          elseif ("${{ inputs.tag }}" -ne "") { $tag = "${{ inputs.tag }}" }
          else { Write-Error "No tag: push a v2.* tag or pass inputs.tag."; exit 1 }
          if ($tag -notmatch '^v2\.\d+\.\d+$') { Write-Error "Tag '$tag' is not v2.x.y."; exit 1 }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

      - name: Tag matches Cargo workspace version
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.version }}"
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version = "' + [regex]::Escape($version) + '"') {
            Write-Error "Tag version $version does not match [workspace.package] version in Cargo.toml — bump the workspace version first, then tag."
            exit 1
          }
          # DS-71: src-tauri/tauri.conf.json still says 1.0.2 and
          # frontend/package.json has its own version — both belong to
          # the kept-but-unshipped v1 Tauri shell (DS-01 owns the
          # version audit). The single source of truth for the v2.0
          # release is the workspace version above.
          Write-Host "Version $version matches the Cargo workspace version."

      # DS-04 (deep-scan FC-02/FC-25) + DS-76: the release is gated on
      # CI green — a release pre-condition, fail closed. CI never runs
      # on a tag push (ci.yml triggers on push/PR to main only), so
      # this step checks the CI run for the TAG COMMIT itself: the same
      # SHA was pushed to main first, and CI ran there. It fails
      # (exit 1) when no CI run exists for the commit on main, when
      # the run is still in progress, or when its conclusion is
      # anything but success. Run-level success implies the `gate`
      # aggregator passed (gate is if: always() and fails unless every
      # needed job succeeded), so no per-job parsing is needed. If a
      # run was cancelled by a later push (ci.yml concurrency:
      # cancel-in-progress), re-run it with `gh run rerun` and then
      # re-trigger the release — do NOT bypass this step. `gh` is
      # pre-authenticated on the runner; GITHUB_TOKEN (contents: read)
      # is enough to list runs.
      - name: CI gate must be green for the tag commit (fail closed)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          git fetch --no-tags --depth 1 origin "refs/tags/$tag" 2>$null | Out-Null
          $sha = (git rev-parse "FETCH_HEAD^{commit}" 2>$null)
          if (-not $sha) { $sha = (git rev-parse "refs/tags/$tag^{commit}" 2>$null) }
          if (-not $sha) {
            Write-Error "Could not resolve tag $tag to a commit — cannot verify CI status for the release. Failing closed (DS-04)."
            exit 1
          }
          Write-Host "Tag $tag is commit $sha — checking the CI run for that commit on main."
          $runsJson = gh run list --workflow ci.yml --branch main --limit 100 --json databaseId,headSha,conclusion,status,url
          if ($LASTEXITCODE -ne 0) {
            Write-Error "gh run list failed — cannot verify CI status. Failing closed (DS-04)."
            exit 1
          }
          $runs = $runsJson | ConvertFrom-Json
          $run = @($runs | Where-Object { $_.headSha -eq $sha }) | Select-Object -First 1
          if (-not $run) {
            Write-Error "No CI run found for commit $sha on main in the last 100 CI runs — the release commit was never CI-gated, OR its run fell off the list. Recovery: push the commit to main and wait for CI green, then tag (do NOT bypass this step). If CI *was* green for this commit, re-run CI on main with 'gh run rerun' so a fresh run for the commit appears in the list, then re-trigger the release. Failing closed (DS-04, R3-20)."
            exit 1
          }
          if ($run.status -ne "completed") {
            Write-Error "CI run $($run.databaseId) ($($run.url)) for commit $sha is still $($run.status) — the release cannot start until CI is green. Failing closed (DS-04)."
            exit 1
          }
          if ($run.conclusion -ne "success") {
            Write-Error "CI run $($run.databaseId) ($($run.url)) for commit $sha concluded '$($run.conclusion)' — the release is BLOCKED until CI is green on this commit. Failing closed (DS-04)."
            exit 1
          }
          Write-Host "CI gate GREEN for commit $sha (run $($run.databaseId)): $($run.url)"

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          # Pinned (R3-12): SDK 10.0.404 is the version installed on
          # the green v2.0.6 release run (44717524848) — "10.0.x" floats.
          dotnet-version: "10.0.404"

      - name: Install NSIS (makensis)
        shell: pwsh
        run: |
          # windows-latest no longer ships NSIS on PATH (release run
          # 43870249083 failed the makensis check below) — install it
          # via Chocolatey and put it on PATH for the later steps.
          # Pinned (R3-12): NSIS 3.13.0 is the version installed on
          # the green v2.0.6 release run (44717524848, makensis v3.13)
          # — an unpinned `choco install nsis` floats with the feed.
          choco install nsis --version 3.13.0 -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsis\makensis.exe") { "$nsis" >> $env:GITHUB_PATH }

      - name: Check makensis present (fail closed)
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) { Write-Error "makensis not found on the runner — the NSIS installer cannot be built. Install NSIS (https://nsis.sourceforge.io/) on the runner image."; exit 1 }
          makensis -VERSION

      # ---- Sidecar FIRST: fetch pinned HIDMaestro, verify hashes, AOT publish ----
      # The v2.0 installer bundles the staged sidecar exe beside
      # rsh-daemon.exe (the daemon resolves it relative to its own
      # exe). The shared script still stages to
      # `src-tauri/binaries/…` — the packaging step below copies it
      # out of there; the Tauri shell itself is never built.
      - name: Fetch + verify HIDMaestro v2.1.0, publish sidecar (AOT)
        id: sidecar
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/ci/stage-sidecar.ps1

      # ---- Gates (superset of the CI gates for the ship crates) ----
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --exclude rsh-app (warnings denied)
        # Windows runner: every non-Tauri member compiles here
        # (rsh-app is excluded — v2.0 does not build or ship it;
        # the package name is rsh-app, NOT src-tauri: --exclude
        # src-tauri does not match it and clippy then compiles the
        # Tauri shell, which panics on the missing frontend/dist).
        run: cargo clippy --workspace --exclude rsh-app --all-targets -- -D warnings

      - name: cargo test (ship crates, --release)
        # The debug full suite runs in CI on every push (user order:
        # no repeated full-suite loops in dry runs). The --release run
        # below stays — CI never runs --release tests, so only this
        # workflow proves the ship crates in release mode.
        run: cargo test -p rsh-daemon -p rsh-ui -p rsh-api -p rsh-ipc --release

      - name: Install cargo-deny
        # cargo-deny is not preinstalled on the runner (release run
        # 43875439798 failed here with "no such command: `deny`").
        # Pinned to 0.20.2 --locked, same as CI (ci.yml audit job).
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: cargo deny check
        run: cargo deny check

      # ---- Build the ship binaries ----
      - name: cargo build --release (daemon + UI)
        run: cargo build --release -p rsh-daemon -p rsh-ui

      # R3-03: the perf gate (binary sizes vs 27/34 MB, daemon
      # --check <= 5000 ms) never ran in the release workflow — a
      # size/startup regression would have shipped silently. Same
      # tools/gate-checks/perf-gate.sh the local gate and CI's
      # `perf-gate` job run, fail-closed (no --record-only flag).
      - name: perf-gate (sizes + daemon --check, fail-closed)
        shell: bash
        run: bash tools/gate-checks/perf-gate.sh --out "$RUNNER_TEMP/perf-gate"

      # R3-18: archive the PDBs for this tag so a field crash can be
      # symbolicated later. NOT a release asset — the release still
      # ships exactly 3 files (see "Verify staged assets"). Requires
      # [profile.release] debug = true (Cargo.toml); if the PDBs are
      # missing the step fails closed instead of archiving nothing.
      # PDB FILENAME: rustc names the PDB after the CRATE name
      # (underscores), not the bin-target name (hyphens) — the
      # CodeView record in the shipped v2.0.6 rsh-daemon.exe names
      # `rsh_daemon.pdb` (rsh-ui.exe: `rsh_ui.pdb`); a step looking
      # for target/release/rsh-daemon.pdb fails on a filename that
      # never exists (v2.0.7 runs 44962668126 + 44967991529). Search
      # the top level first, then deps/ (cargo's out-dir; the
      # test-harness PDBs there are hash-suffixed, so the exact
      # unhashed name is unambiguous), and normalise the found PDB
      # to the hyphenated name the upload step below expects. The
      # PDB must come from the SAME compilation as the shipped exes
      # (GUID/Age fingerprint) — it does: it is emitted by the
      # `cargo build --release` step above.
      - name: Archive PDBs (symbols for this tag, not a release asset)
        shell: pwsh
        run: |
          foreach ($name in @("rsh_daemon.pdb", "rsh_ui.pdb")) {
            $dest = "target/release/" + ($name -replace "_", "-")
            $found = $null
            foreach ($candidate in @("target/release/$name", "target/release/deps/$name")) {
              if (Test-Path $candidate) { $found = $candidate; break }
            }
            if (-not $found) { Write-Error "PDB missing: $name (looked in target/release/ and target/release/deps/) — [profile.release] debug = true must emit it. Refusing to release without symbols (R3-18)."; exit 1 }
            if ($found -ne $dest) { Copy-Item $found $dest }
            Write-Host "PDB found: $found -> $dest"
          }
      - name: Upload PDBs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsh-symbols-${{ steps.tag.outputs.tag }}
          path: |
            target/release/rsh-daemon.pdb
            target/release/rsh-ui.pdb
          retention-days: 90

      # ---- No console window — PE subsystem must be GUI ----
      # The v1.0.0 launch failure (user PC): the app opened behind a
      # visible console window and then vanished. Causes were
      # console-subsystem binaries. This step proves, before anything
      # is published, that ALL THREE binaries are
      # IMAGE_SUBSYSTEM_WINDOWS_GUI (2) — a CUI binary (3) fails the
      # run. Paths: the sidecar path is where stage-sidecar.ps1 stages
      # it; the daemon/UI exes are the workspace-root target dir.
      - name: No console window — PE subsystem must be GUI
        shell: pwsh
        run: |
          function Get-PESubsystem([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          }
          $bins = @(
            "src-tauri/binaries/rsh-hm-sidecar-x86_64-pc-windows-msvc.exe",
            "target/release/rsh-daemon.exe",
            "target/release/rsh-ui.exe"
          )
          foreach ($b in $bins) {
            if (-not (Test-Path $b)) { throw "missing binary: $b" }
            $sub = Get-PESubsystem $b
            # 2 = IMAGE_SUBSYSTEM_WINDOWS_GUI, 3 = IMAGE_SUBSYSTEM_WINDOWS_CUI
            if ($sub -ne 2) { throw "$b has PE subsystem $sub, expected 2 (GUI) — a console window would open" }
            Write-Host "$b : subsystem 2 (GUI) OK"
          }

      # ---- Firmware v4.0.2: build + sign (TWO assets) ----
      # Runs BEFORE the NSIS build: the installer bundles
      # firmware-signed.bin, so makensis fails closed if the
      # image is missing or unsigned.
      # Both firmware files are built HERE on the runner from the
      # tagged source — never copied from a developer machine — so
      # the release is reproducible from the tag alone. The merged
      # factory image and the Ed25519-signed OTA image come out of
      # one `pio run` (platformio.ini post-scripts: merge_bin.py +
      # sign_firmware.py). The signing key comes from the GitHub
      # secret RSH_SIGNING_KEY_PEM (the production Ed25519 key; its
      # pubkey is baked into the firmware as firmware/signing_pubkey.h).
      # The private key is written to $RUNNER_TEMP only, used once,
      # and deleted in this same step. The derived public key (public
      # by nature) stays in $RUNNER_TEMP for the verify step below.
      - name: Build + sign firmware (merged + OTA)
        shell: pwsh
        env:
          RSH_SIGNING_KEY_PEM: ${{ secrets.RSH_SIGNING_KEY_PEM }}
        run: |
          if (-not $env:RSH_SIGNING_KEY_PEM) { Write-Error "RSH_SIGNING_KEY_PEM secret is not set — firmware cannot be signed. Refusing an unsigned OTA image."; exit 1 }
          python -m pip install --quiet "platformio==6.2.0"
          pio --version
          $keyFile = Join-Path $env:RUNNER_TEMP "rsh-signing-key.pem"
          $pubFile = Join-Path $env:RUNNER_TEMP "rsh-signing-pub.pem"
          $derivedHeader = Join-Path $env:RUNNER_TEMP "signing_pubkey.derived.h"
          [System.IO.File]::WriteAllText($keyFile, $env:RSH_SIGNING_KEY_PEM)
          try {
            $openssl = Get-Command openssl -ErrorAction SilentlyContinue
            if (-not $openssl) { Write-Error "openssl not found on the runner — cannot derive the verify pubkey."; exit 1 }
            openssl pkey -in $keyFile -pubout -out $pubFile
            if ($LASTEXITCODE -ne 0) { Write-Error "openssl pkey failed — the RSH_SIGNING_KEY_PEM secret is not a valid PEM key."; exit 1 }
            # DS-13: derive the pubkey header from the secret NOW, while
            # the private key still exists — the Verify step below diffs
            # these 32 bytes against the baked firmware/signing_pubkey.h
            # and fails closed on any difference (a rotated secret or a
            # stale header would otherwise ship an OTA image every board
            # rejects, with a green release). The derived header is
            # public-key material only; the private key is deleted below.
            python firmware/sign-image.py --pubkey-header $keyFile --out $derivedHeader
            if ($LASTEXITCODE -ne 0) { Write-Error "sign-image.py --pubkey-header failed — cannot derive the baked-pubkey cross-check header."; exit 1 }
            $env:RSH_SIGNING_KEY = $keyFile
            Push-Location firmware
            try { pio run -e esp32dev } finally { Pop-Location }
          } finally { Remove-Item $keyFile -Force -ErrorAction SilentlyContinue }
          Write-Host "Firmware build + sign done. Private key deleted; pubkey + derived header kept at $pubFile / $derivedHeader for verification."

      # ---- Firmware verify (fail closed — before the installer) ----
      # Proves, before the installer is built (it bundles the OTA image):
      # the signed OTA image both exist; the OTA image is exactly
      # firmware.bin + 68 B trailer (64 B signature + "RSHS"); the
      # version marker matches the firmware version; and the
      # signature verifies against the production pubkey. DS-13 also
      # proves the pubkey baked into firmware/signing_pubkey.h is the
      # SAME 32 bytes the secret derives (byte comparison — the two
      # headers carry different comments, so a whole-file diff would
      # always fail). Any failure here fails the run — an unsigned or
      # wrong-version OTA image must never reach a release (a board
      # would reject it, or worse, an old image would ship as new).
      - name: Verify firmware (fail closed)
        id: verify-firmware
        shell: pwsh
        run: |
          $buildDir = "firmware/.pio/build/esp32dev"
          $fw = Join-Path $buildDir "firmware.bin"
          $signed = Join-Path $buildDir "firmware-signed.bin"
          $merged = Get-ChildItem (Join-Path $buildDir "RSH-Firmware-DevKitV1-*.bin") -File | Where-Object { $_.Name -notmatch "-OTA\.bin$" }
          if ($merged.Count -ne 1) { Write-Error "Expected exactly one merged firmware image in $buildDir, found $($merged.Count)."; exit 1 }
          if (-not (Test-Path $fw)) { Write-Error "firmware.bin not found after pio run."; exit 1 }
          if (-not (Test-Path $signed)) { Write-Error "Signed OTA image (firmware-signed.bin) not found after pio run — signing must have been skipped. Refusing an unsigned OTA image."; exit 1 }
          if ($merged[0].Name -notmatch 'v(\d+\.\d+\.\d+)\.bin$') { Write-Error "Merged image name '$($merged[0].Name)' has no firmware version."; exit 1 }
          $fwVersion = $Matches[1]
          $fwLen = (Get-Item $fw).Length
          $signedLen = (Get-Item $signed).Length
          if ($signedLen -ne ($fwLen + 68)) { Write-Error "Signed OTA image is $signedLen B, expected firmware.bin ($fwLen B) + 68 B trailer."; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes($signed)
          if ([System.Text.Encoding]::ASCII.GetString($bytes[-4..-1]) -ne "RSHS") { Write-Error "Signed OTA image trailer is not RSHS."; exit 1 }
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii -notmatch "Version.*$([regex]::Escape($fwVersion))") { Write-Error "Signed OTA image has no Version $fwVersion marker."; exit 1 }
          $pubFile = Join-Path $env:RUNNER_TEMP "rsh-signing-pub.pem"
          python firmware/sign-image.py --verify $pubFile $signed
          if ($LASTEXITCODE -ne 0) { Write-Error "sign-image.py --verify FAILED — the OTA image does not verify against the production pubkey. Refusing to ship it."; exit 1 }
          # DS-13: baked-pubkey cross-check (fail closed). Compare the 32
          # key bytes only — the derived header (from the secret) and the
          # committed header carry different comments, so whole-file diff
          # is meaningless. A mismatch means the board would reject every
          # OTA image this release ships (old firmware keeps running, but
          # OTA is dead with no other signal) — refuse to ship it.
          $derivedHeader = Join-Path $env:RUNNER_TEMP "signing_pubkey.derived.h"
          if (-not (Test-Path $derivedHeader)) { Write-Error "Derived pubkey header not found at $derivedHeader — the build step must derive it from the signing secret (DS-13). Refusing to ship without the cross-check."; exit 1 }
          $derivedBytes = [regex]::Matches((Get-Content $derivedHeader -Raw), '0x[0-9a-fA-F]{2}') | ForEach-Object { $_.Value.ToLower() }
          $bakedBytes = [regex]::Matches((Get-Content firmware/signing_pubkey.h -Raw), '0x[0-9a-fA-F]{2}') | ForEach-Object { $_.Value.ToLower() }
          if ($derivedBytes.Count -ne 32 -or $bakedBytes.Count -ne 32) { Write-Error "Pubkey byte extraction failed — derived header has $($derivedBytes.Count) bytes, baked header has $($bakedBytes.Count) bytes, expected 32 each. Refusing to ship."; exit 1 }
          if (Compare-Object $derivedBytes $bakedBytes) { Write-Error "Baked OTA pubkey in firmware/signing_pubkey.h does NOT match the RSH_SIGNING_KEY_PEM secret — the board would reject every OTA image. Rotate/re-bake the header (sign-image.py --pubkey-header) and rebuild."; exit 1 }
          Write-Host "Baked OTA pubkey matches the signing secret (32/32 bytes, DS-13 cross-check OK)."
          Write-Host "Firmware verify OK: merged $($merged[0].Name) ($((Get-Item $merged[0].FullName).Length) B), OTA image $signedLen B, Version $fwVersion, signature verifies."
          # DS-72: expose the derived firmware version for the release
          # notes below — never hardcode it there again.
          "fw_version=$fwVersion" >> $env:GITHUB_OUTPUT

      # ---- NSIS installer (exe + bundled firmware image) ----
      # The .nsi script is generated here (no committed installer
      # script — the installer IS this step). It installs the two
      # binaries + the sidecar beside the daemon + the signed OTA
      # firmware image (WebOTA flow, no download needed), creates the
      # program-scoped inbound firewall rule for rsh-daemon.exe
      # (Private + Public), and removes the rule on uninstall.
      # SMART installer (v2.0.2): .onInit detects an existing install
      # (HKLM\Software\RSH "Version", fallback DisplayVersion, then
      # InstallDir for pre-2.0.2 installs) and offers Update /
      # Reinstall / Downgrade-warning; silent installs proceed as an
      # update. An update stops the running daemon/UI first, keeps
      # %APPDATA%\RSH + the Run key, and restarts the daemon after.
      # The installer SEEDS the Run key (tray from the first boot);
      # the daemon OWNS it after that and syncs it from
      # settings.autostart on startup (deletes it when off, repairs
      # it when on — see tray_autostart.rs).
      # Round 3 WS-6 (R3-AK-01): the Task Scheduler supervisor script
      # the installer runs (and the uninstaller runs with -Uninstall).
      # Written here beside the .nsi — the installer IS this workflow,
      # so there is no committed .ps1 either. `schtasks /create`
      # cannot express "restart on failure", so the task is built with
      # the ScheduledTasks cmdlets: logon trigger, action
      # `rsh-daemon.exe --scheduled-respawn`, restart every 1 minute
      # up to 3 times on failure, no execution time limit (the daemon
      # runs forever — the default 3-day limit would kill it), user
      # session only (LogonType Interactive, RunLevel Limited — the
      # daemon must never run elevated), and MultipleInstances
      # IgnoreNew (the Run key usually wins the logon race; a second
      # trigger while the task's daemon is alive must not spawn a
      # duplicate). The daemon never creates its own task at runtime
      # (no self-elevation) — install/uninstall only.
      - name: Write scheduled-task script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          @'
          # RSH scheduled-task supervisor (Round 3 WS-6, R3-AK-01).
          # -Install: create/update the "RSH Daemon" Task Scheduler task.
          # -Uninstall: remove it (best-effort — a missing task is fine).
          # The task is the mid-session supervisor for the daemon while
          # the UI is closed (the UI respawn stays the primary path
          # while the UI is open). The daemon itself enforces the fatal
          # latch: a `--scheduled-respawn` launch exits 0 while a fresh
          # fatal `daemon-status.json` exists, so a fatally-broken
          # daemon is never respawned in a loop.
          param(
            [switch]$Install,
            [switch]$Uninstall,
            [string]$InstallDir
          )
          $ErrorActionPreference = "Stop"
          $TaskName = "RSH Daemon"
          if ($Uninstall) {
            Unregister-ScheduledTask -TaskName $TaskName -Confirm:$false -ErrorAction SilentlyContinue
            exit 0
          }
          if (-not $Install) { Write-Error "rsh-task.ps1: pass -Install or -Uninstall."; exit 1 }
          if (-not $InstallDir) { Write-Error "rsh-task.ps1: -InstallDir is required with -Install."; exit 1 }
          $exe = Join-Path $InstallDir "rsh-daemon.exe"
          if (-not (Test-Path $exe)) { Write-Error "rsh-task.ps1: $exe not found."; exit 1 }
          $action = New-ScheduledTaskAction -Execute $exe -Argument "--scheduled-respawn"
          $trigger = New-ScheduledTaskTrigger -AtLogOn
          $principal = New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType Interactive -RunLevel Limited
          $settings = New-ScheduledTaskSettingsSet -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -MultipleInstances IgnoreNew
          Register-ScheduledTask -TaskName $TaskName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Description "RSH wheel daemon supervisor: relaunches rsh-daemon at logon and restarts it on failure." -Force | Out-Null
          '@ | Set-Content -Path installer\rsh-task.ps1 -Encoding ASCII
          Get-Content installer\rsh-task.ps1 | Select-Object -First 5
      - name: Write NSIS script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          @'
          ; RSH v2.0 NSIS installer — generated by .github/workflows/release.yml
          ; (no committed .nsi: the installer is defined by the release workflow).
          ; Three-asset release: this installer is one of three
          ; release assets (exe + merged firmware + OTA firmware).
          !include "LogicLib.nsh"
          !include "WordFunc.nsh"
          !include "StrFunc.nsh"
          ${Using:StrFunc} StrStr
          !define VERSION "${VERSION}"
          ; Smart-installer state: set by .onInit (detection) and read
          ; by the install section (daemon restart after an update).
          Var UpdateMode
          Var InstalledVersion
          Name "RSH"
          ; NOTE: makensis changes its working directory to the
          ; script's directory (installer/), so every path below is
          ; relative to installer/ — hence the ..\ prefix. (Release
          ; run 43878025293 failed here: "target\release\..." was
          ; resolved as installer\target\release\..., which does not
          ; exist.)
          OutFile "..\release-staging\RSH_${VERSION}_x64-setup.exe"
          InstallDir "$PROGRAMFILES64\RSH"
          InstallDirRegKey HKLM "Software\RSH" "InstallDir"
          RequestExecutionLevel admin
          ; Admin is requested ONCE here, at install time, so the firewall
          ; rule below can be created. Nothing at login ever prompts (D-7:
          ; the daemon defers the elevated HIDMaestro sidecar until
          ; "Send to game" is turned on).
          ; ---- Smart installer: detect an existing install ------------
          ; Reads HKLM\Software\RSH "Version" (written by this installer
          ; since v2.0.2) and falls back to the Uninstall key
          ; DisplayVersion, then to InstallDir for a v2.0.0/v2.0.1
          ; install (those wrote no version value).
          ; NOTE on registry view: this is a 32-bit installer, so
          ; HKLM\Software\... reads/writes land in the WOW6432Node
          ; view on 64-bit Windows — the SAME view v2.0.0/v2.0.1 used,
          ; so detection matches existing installs. Do NOT add
          ; SetRegView 64: it would make v2.0.2 blind to v2.0.1.
          ; Silent installs (/S, e.g. CI) skip the prompt and proceed
          ; as an update/reinstall — the daemon restart below still runs.
          Function .onInit
            StrCpy $UpdateMode "0"
            StrCpy $InstalledVersion ""
            ReadRegStr $InstalledVersion HKLM "Software\RSH" "Version"
            ${If} $InstalledVersion == ""
              ReadRegStr $InstalledVersion HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSH" "DisplayVersion"
            ${EndIf}
            ${If} $InstalledVersion == ""
              ReadRegStr $0 HKLM "Software\RSH" "InstallDir"
              ${If} $0 != ""
                StrCpy $InstalledVersion "unknown"
              ${EndIf}
            ${EndIf}
            ${If} $InstalledVersion == ""
              Return
            ${EndIf}
            StrCpy $UpdateMode "1"
            IfSilent done
            ${If} $InstalledVersion == "unknown"
              MessageBox MB_YESNO|MB_ICONQUESTION "RSH is already installed on this PC.$\n$\nUpdate it to ${VERSION}? Your settings and profiles are kept." IDYES done
              Abort
            ${EndIf}
            ${VersionCompare} $InstalledVersion "${VERSION}" $0
            ${If} $0 == 0
              MessageBox MB_YESNO|MB_ICONQUESTION "RSH ${VERSION} is already installed (latest).$\n$\nReinstall it?" IDYES done
              Abort
            ${ElseIf} $0 == 1
              MessageBox MB_YESNO|MB_ICONEXCLAMATION "A NEWER version of RSH ($InstalledVersion) is already installed.$\n$\nDowngrade to ${VERSION}? (Not recommended.)" IDYES done
              Abort
            ${Else}
              MessageBox MB_YESNO|MB_ICONQUESTION "RSH $InstalledVersion is installed. Update to ${VERSION}?$\n$\nYour settings and profiles are kept." IDYES done
              Abort
            ${EndIf}
            done:
          FunctionEnd
          Section "RSH"
            SetOutPath "$INSTDIR"
            ; Stop a running daemon/UI first: locked files cannot be
            ; overwritten on an update, and the old daemon would keep
            ; the IPC pipe. Best-effort (taskkill exits non-zero when
            ; the process is not running; nsExec ignores that).
            ; DS-68: kill the UI FIRST, then the daemon — the UI's
            ; monitor respawns a dead daemon (budgeted, from 1 s), so
            ; killing the daemon first lets a fresh old-version daemon
            ; start mid-install and re-lock rsh-daemon.exe. LOOP the
            ; kills (max 10 passes) until NEITHER process exists, so
            ; a respawn that races one pass is caught by the next;
            ; the file copy below still fails closed if a process
            ; somehow survives (makensis errors). Existence is checked
            ; with tasklist: /NH prints the image name only when a
            ; matching process exists, otherwise the "No tasks are
            ; running" INFO line (which contains neither exe name).
            StrCpy $R0 0
            DS68KillLoop:
              nsExec::Exec 'taskkill /F /IM rsh-ui.exe'
              Sleep 500
              nsExec::Exec 'taskkill /F /IM rsh-daemon.exe'
              ; F21: also stop the legacy Tauri v1 app (installed exe
              ; `RSH.exe`): it binds the wheel UDP port 4211 at launch
              ; and, if left running, the new daemon can never bind
              ; the port (`AddrInUse` forever — user log: 117x). This
              ; installer does NOT uninstall the old app — it lives in
              ; its own per-user install with its own uninstall entry
              ; — it only stops the running process so the port is
              ; free; the user removes the old app via its own
              ; "Uninstall RSH" entry afterwards.
              nsExec::Exec 'taskkill /F /IM RSH.exe'
              Sleep 500
              IntOp $R0 $R0 + 1
              nsExec::ExecToStack 'tasklist /FI "IMAGENAME eq rsh-ui.exe" /NH'
              Pop $R1  ; exit code (discard)
              Pop $R2  ; stdout: image name present only if still running
              ${StrStr} $R3 $R2 "rsh-ui.exe"
              ${If} $R3 != ""
              ${AndIf} $R0 < 10
                Goto DS68KillLoop
              ${EndIf}
              nsExec::ExecToStack 'tasklist /FI "IMAGENAME eq rsh-daemon.exe" /NH'
              Pop $R1  ; exit code (discard)
              Pop $R2  ; stdout: image name present only if still running
              ${StrStr} $R3 $R2 "rsh-daemon.exe"
              ${If} $R3 != ""
              ${AndIf} $R0 < 10
                Goto DS68KillLoop
              ${EndIf}
            File "..\target\release\rsh-daemon.exe"
            File "..\target\release\rsh-ui.exe"
            ; Sidecar MUST sit beside rsh-daemon.exe: the daemon resolves it
            ; as <own exe dir>\rsh-hm-sidecar.exe (resolve_sidecar_path).
            File "/oname=rsh-hm-sidecar.exe" "..\src-tauri\binaries\rsh-hm-sidecar-x86_64-pc-windows-msvc.exe"
            ; HIDMaestro LICENSE (GitHub issue #2): the sidecar is a
            ; NativeAOT build with HIDMaestro compiled in, and the MIT
            ; license requires its notice to ship with the software.
            ; This file is the LICENSE from the pinned HIDMaestro v2.1.0
            ; release ZIP, committed verbatim (see
            ; THIRD-PARTY-LICENSES.md §3); it installs beside the
            ; sidecar so the notice is always with the binary.
            File "..\tools\rsh-hm-sidecar\HIDMaestro-LICENSE.txt"
            ; Signed OTA image, bundled so the app can flash the board
            ; with no download and no manual step: the daemon resolves
            ; it as <own exe dir>\firmware-signed.bin (same pattern as
            ; the sidecar). Built + signed in the firmware step above,
            ; so makensis fails closed here if it is missing.
            File "..\firmware\.pio\build\esp32dev\firmware-signed.bin"
            WriteRegStr HKLM "Software\RSH" "InstallDir" "$INSTDIR"
            ; Version values the smart installer reads back in .onInit
            ; (detection + update/reinstall/downgrade decision).
            WriteRegStr HKLM "Software\RSH" "Version" "${VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSH" "DisplayName" "RSH ${VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSH" "DisplayVersion" "${VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSH" "UninstallString" "$INSTDIR\uninstall.exe"
            ; Autostart the daemon at login (HKCU Run): the daemon owns
            ; the tray + IPC and syncs this key from settings.autostart
            ; on startup (default true in v2.0.1). An update install
            ; never touches this key or %APPDATA%\RSH (profiles and
            ; settings survive an update); only uninstall removes it.
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "RSH" "$INSTDIR\rsh-daemon.exe"
            ; Round 3 WS-6 (R3-AK-02): WER LocalDumps — native-crash
            ; forensics with zero runtime cost. WER writes the dump
            ; out of process after any unhandled exception, including
            ; native SEH faults the Rust panic hook can never see.
            ; DumpType 1 = mini dump (MBs, usually enough with
            ; symbols — a full dump can be 100s of MB on a low-end
            ; disk); DumpCount 5 caps the ring so dumps can never
            ; fill the disk. The folder is created here (WER also
            ; creates it, but an explicit directory is fail-closed).
            ; SetRegView 64 is SCOPED: WER reads LocalDumps from the
            ; native 64-bit view, and this 32-bit installer would
            ; otherwise land the keys in WOW6432Node, where WER never
            ; looks for a 64-bit exe. The view is restored to 32
            ; immediately after, so the RSH-key detection (which
            ; deliberately stays 32-bit — see the note in .onInit)
            ; is unaffected. The uninstaller removes these keys
            ; (the dumps themselves are kept, like %APPDATA%\RSH).
            CreateDirectory "$PROGRAMDATA\RSH\dumps"
            SetRegView 64
            WriteRegStr HKLM "Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\rsh-daemon.exe" "DumpFolder" "$PROGRAMDATA\RSH\dumps"
            WriteRegDWORD HKLM "Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\rsh-daemon.exe" "DumpType" 1
            WriteRegDWORD HKLM "Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\rsh-daemon.exe" "DumpCount" 5
            WriteRegStr HKLM "Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\rsh-ui.exe" "DumpFolder" "$PROGRAMDATA\RSH\dumps"
            WriteRegDWORD HKLM "Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\rsh-ui.exe" "DumpType" 1
            WriteRegDWORD HKLM "Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\rsh-ui.exe" "DumpCount" 5
            SetRegView 32
            ; Round 3 WS-6 (R3-AK-01): Task Scheduler supervisor —
            ; the "RSH Daemon" task relaunches the daemon at logon
            ; and restarts it on failure (1 min × 3, see
            ; installer\rsh-task.ps1). It covers the UI-closed case
            ; (the UI respawn stays the primary path while the UI is
            ; open). The script is copied into $INSTDIR because the
            ; uninstaller runs it again with -Uninstall. A failed
            ; registration warns but never fails the install — the
            ; Run key still starts the daemon at login; only the
            ; mid-session respawn is missing (same pattern as the
            ; firewall rule above).
            File "rsh-task.ps1"
            nsExec::ExecToStack 'powershell -NoProfile -ExecutionPolicy Bypass -File "$INSTDIR\rsh-task.ps1" -Install -InstallDir "$INSTDIR"'
            Pop $0
            Pop $1  ; DS-70: ExecToStack pushes exit code + stdout — discard both
            ${If} $0 != 0
              MessageBox MB_ICONEXCLAMATION "RSH installed, but the restart task could not be created (exit $0). The daemon still starts at login, but it will not restart itself if it crashes while the UI is closed."
            ${EndIf}
            WriteUninstaller "$INSTDIR\uninstall.exe"
            CreateDirectory "$SMPROGRAMS\RSH"
            CreateShortcut "$SMPROGRAMS\RSH\RSH Wheel.lnk" "$INSTDIR\rsh-ui.exe"
            CreateShortcut "$SMPROGRAMS\RSH\Uninstall RSH.lnk" "$INSTDIR\uninstall.exe"
            ; Firewall rule (LOGIC-FIX-PLAN §4.3 / C-10): program-scoped
            ; inbound UDP for the daemon only (the board's 200 Hz stream
            ; arrives unsolicited from the board, source port 4211) on
            ; Private + Public. No port scope: a port-scoped rule would
            ; also allow other programs on that port. Hidden via nsExec
            ; (no console flash during install).
            ; Update-safe: remove any rule from a previous install first,
            ; otherwise every update would leave a duplicate "RSH" rule.
            nsExec::Exec 'netsh advfirewall firewall delete rule name="RSH"'
            nsExec::ExecToStack 'netsh advfirewall firewall add rule name="RSH" dir=in action=allow program="$INSTDIR\rsh-daemon.exe" profile=private,public'
            Pop $0
            Pop $1  ; DS-70: ExecToStack pushes exit code + stdout — discard both
            ${If} $0 != 0
              MessageBox MB_ICONEXCLAMATION "RSH installed, but the Windows Firewall rule could not be created (netsh exit $0). The wheel may not connect over Wi-Fi until you allow RSH through the firewall manually."
            ${EndIf}
            ; After an update, restart the daemon (it was stopped
            ; above so its files could be replaced). Fresh installs do
            ; not start it — the UI self-spawns it on first launch.
            ; ExecShell, NOT Exec: NSIS Exec calls CreateProcess with
            ; bInheritHandles=TRUE, so the forever-running daemon
            ; inherits the installer's stdio/nsExec pipes and holds
            ; them open — the silent installer then never finishes
            ; and the caller (Start-Process -Wait) hangs forever.
            ; This hung release run 44047919933 for 13+ min at the
            ; second (update) install until the run was cancelled
            ; (orphan rsh-daemon pid 8920 was still alive). The same
            ; inherited-pipe hang is documented in nteract/nteract
            ; aa838d9. ShellExecuteEx gives the daemon a fresh handle
            ; table, so the installer can exit.
            ${If} $UpdateMode == "1"
              ExecShell "open" "$INSTDIR\rsh-daemon.exe"
            ${EndIf}
          SectionEnd
          Section "Uninstall"
            ; DS-10: stop the running app FIRST (UI first, then daemon —
            ; DS-68: the UI respawns a dead daemon, so daemon-first
            ; leaves a fresh process holding the files). Without this,
            ; Delete on a locked exe fails silently and RMDir fails on
            ; the non-empty dir — a partial uninstall (binaries + dir
            ; left behind, registry removed) reported as success.
            nsExec::Exec 'taskkill /F /IM rsh-ui.exe'
            Sleep 1000
            nsExec::Exec 'taskkill /F /IM rsh-daemon.exe'
            nsExec::Exec 'taskkill /F /IM RSH.exe'
            nsExec::Exec 'taskkill /F /IM rsh-hm-sidecar.exe'
            Sleep 1000
            nsExec::Exec 'taskkill /F /IM rsh-ui.exe'
            nsExec::Exec 'taskkill /F /IM rsh-daemon.exe'
            ; Remove the firewall rule first (best-effort: a missing rule
            ; is fine on a machine where the install-time rule failed).
            nsExec::ExecToStack 'netsh advfirewall firewall delete rule name="RSH"'
            Pop $0
            Pop $1  ; DS-70: ExecToStack pushes exit code + stdout — discard both
            ; Round 3 WS-6 (R3-AK-01): remove the "RSH Daemon"
            ; supervisor task (best-effort — a missing task is fine).
            ; Runs before the script file itself is deleted below.
            ; The `schtasks` line is the fallback for an install
            ; whose rsh-task.ps1 is already gone.
            nsExec::Exec 'powershell -NoProfile -ExecutionPolicy Bypass -File "$INSTDIR\rsh-task.ps1" -Uninstall'
            nsExec::Exec 'schtasks /delete /tn "RSH Daemon" /f'
            ; Round 3 WS-6 (R3-AK-02): remove the WER LocalDumps
            ; keys — same scoped SetRegView 64 as the install (the
            ; keys live in the native 64-bit view, not WOW6432Node).
            ; The dumps in %ProgramData%\RSH\dumps are deliberately
            ; KEPT (crash forensics for a later reinstall — same
            ; KEEP decision as %APPDATA%\RSH below).
            SetRegView 64
            DeleteRegKey HKLM "Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\rsh-daemon.exe"
            DeleteRegKey HKLM "Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\rsh-ui.exe"
            SetRegView 32
            Delete "$INSTDIR\rsh-daemon.exe"
            Delete "$INSTDIR\rsh-ui.exe"
            Delete "$INSTDIR\rsh-hm-sidecar.exe"
            Delete "$INSTDIR\HIDMaestro-LICENSE.txt"
            Delete "$INSTDIR\firmware-signed.bin"
            Delete "$INSTDIR\rsh-task.ps1"
            Delete "$INSTDIR\uninstall.exe"
            Delete "$SMPROGRAMS\RSH\RSH Wheel.lnk"
            Delete "$SMPROGRAMS\RSH\Uninstall RSH.lnk"
            RMDir "$SMPROGRAMS\RSH"
            RMDir "$INSTDIR"
            ; Retry once (release run 45110475449): the uninstall
            ; exited 0 but $INSTDIR was still there — a Delete on a
            ; locked exe fails silently and RMDir fails on the
            ; non-empty dir. A process can respawn (or a handle can
            ; still be closing) between the taskkills above and the
            ; Deletes, so kill again, wait, and delete again.
            Sleep 3000
            nsExec::Exec 'taskkill /F /IM rsh-ui.exe'
            nsExec::Exec 'taskkill /F /IM rsh-daemon.exe'
            nsExec::Exec 'taskkill /F /IM rsh-hm-sidecar.exe'
            nsExec::Exec 'taskkill /F /IM RSH.exe'
            Sleep 1000
            Delete "$INSTDIR\rsh-daemon.exe"
            Delete "$INSTDIR\rsh-ui.exe"
            Delete "$INSTDIR\rsh-hm-sidecar.exe"
            Delete "$INSTDIR\HIDMaestro-LICENSE.txt"
            Delete "$INSTDIR\firmware-signed.bin"
            Delete "$INSTDIR\rsh-task.ps1"
            Delete "$INSTDIR\uninstall.exe"
            RMDir "$INSTDIR"
            ; DS-10: fail visibly if the daemon exe survived (still
            ; running/locked) instead of reporting a partial uninstall
            ; as success.
            IfFileExists "$INSTDIR\rsh-daemon.exe" 0 warn_done
            MessageBox MB_ICONEXCLAMATION "RSH could not be fully removed: rsh-daemon.exe is still in use (the app may still be running). Close RSH and run the uninstaller again."
            warn_done:
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSH"
            DeleteRegKey HKLM "Software\RSH"
            DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "RSH"
            ; DS-69 (decided: KEEP): %APPDATA%\RSH is intentionally NOT
            ; deleted — profiles, settings, logs and the daemon status
            ; file survive an uninstall, so a reinstall keeps the user's
            ; data (same as an update install, which also keeps it).
            ; Delete %APPDATA%\RSH manually for a fully clean start.
            ; The same KEEP decision is stated in the release notes.
            DetailPrint "DS-69: your RSH data (profiles, settings, logs) was kept — delete it manually for a fully clean start."
          SectionEnd
          '@ -replace '\$\{VERSION\}', "${{ steps.tag.outputs.version }}" | Set-Content -Path installer\rsh.nsi -Encoding ASCII
          Get-Content installer\rsh.nsi | Select-Object -First 5

      - name: Build NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-staging | Out-Null
          makensis installer\rsh.nsi
          Get-ChildItem release-staging -File | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) B)" }

      # ---- Stage firmware assets (after the NSIS build) ----
      # Copies the verified merged + OTA images into release-staging
      # under their release names. Runs after the NSIS build so the
      # staged exe and the firmware assets land together; the
      # "Verify staged assets" step below expects exactly three files.
      - name: Stage firmware assets
        shell: pwsh
        run: |
          $buildDir = "firmware/.pio/build/esp32dev"
          $merged = Get-ChildItem (Join-Path $buildDir "RSH-Firmware-DevKitV1-*.bin") -File | Where-Object { $_.Name -notmatch "-OTA\.bin$" }
          if ($merged.Count -ne 1) { Write-Error "Expected exactly one merged firmware image in $buildDir, found $($merged.Count)."; exit 1 }
          $signed = Join-Path $buildDir "firmware-signed.bin"
          if (-not (Test-Path $signed)) { Write-Error "Signed OTA image (firmware-signed.bin) not found — the firmware build step did not run."; exit 1 }
          $otaName = $merged[0].BaseName + "-OTA.bin"
          Copy-Item $merged[0].FullName (Join-Path "release-staging" $merged[0].Name)
          Copy-Item $signed (Join-Path "release-staging" $otaName)
          Get-FileHash (Join-Path "release-staging" $merged[0].Name) -Algorithm SHA256 | ForEach-Object { Write-Host "  $($merged[0].Name) SHA-256: $($_.Hash)" }
          Get-FileHash (Join-Path "release-staging" $otaName) -Algorithm SHA256 | ForEach-Object { Write-Host "  $otaName SHA-256: $($_.Hash)" }

      # ---- Stage + verify (fail closed — exactly three files) ----
      - name: Verify staged assets (fail closed — exactly three files)
        shell: pwsh
        run: |
          $staging = "release-staging"
          $version = "${{ steps.tag.outputs.version }}"
          $files = Get-ChildItem $staging -File
          if ($files.Count -ne 3) { Write-Error "Expected exactly THREE staged assets (NSIS exe + merged firmware + OTA firmware), found $($files.Count): $(($files | ForEach-Object { $_.Name }) -join ', ')."; exit 1 }
          $names = $files | ForEach-Object { $_.Name }
          if ($names -notcontains "RSH_${version}_x64-setup.exe") { Write-Error "Staged NSIS exe 'RSH_${version}_x64-setup.exe' not found (found: $($names -join ', '))."; exit 1 }
          $merged = @($names | Where-Object { $_ -match '^RSH-Firmware-DevKitV1-v\d+\.\d+\.\d+\.bin$' })
          $ota = @($names | Where-Object { $_ -match '^RSH-Firmware-DevKitV1-v\d+\.\d+\.\d+-OTA\.bin$' })
          if ($merged.Count -ne 1) { Write-Error "Expected exactly one merged firmware image in staging (found: $($names -join ', '))."; exit 1 }
          if ($ota.Count -ne 1) { Write-Error "Expected exactly one OTA firmware image in staging (found: $($names -join ', '))."; exit 1 }
          Get-ChildItem $staging -File | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) B)" }
          Write-Host "Three assets verified."

      # ---- Headless launch smoke test ----
      # Installs the staged NSIS exe silently, proves the firewall
      # rule exists, proves the daemon starts and its IPC answers
      # (`--check` exits 0), then installs a SECOND time over the
      # first (update path: user data in %APPDATA%\RSH must survive,
      # the registry version must be the new one, and the installer
      # must restart the daemon), then uninstalls silently and proves
      # the rule and the install dir are gone. What it CANNOT prove
      # (headless runner): the window actually painting — process +
      # IPC + rule is the strongest launch evidence available in CI;
      # real paint is a human gate (see the human gates in this workflow's header).
      # Every process wait here is timeout-bounded via
      # Start-WaitOrFail: run 44047919933 hung SILENTLY for 13+ min
      # in a bare `Start-Process -Wait` on the second install (the
      # installer had Exec'd the forever-running daemon with
      # inherited handles — fixed with ExecShell above), so a future
      # hang fails fast with the stuck step named.
      - name: Headless launch smoke test (install + update + firewall + daemon check + uninstall)
        shell: pwsh
        run: |
          # Bounded process runner (see the header comment): every
          # wait in this step has a timeout and fails closed, naming
          # the still-alive processes — a hang must be a fast,
          # located failure, never a silent 13-minute stall again.
          function Start-WaitOrFail($file, $arguments, $timeoutSec, $what) {
            Write-Host "Smoke test: starting $what ..."
            $p = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            if (-not $p.WaitForExit($timeoutSec * 1000)) {
              $names = @("rsh-daemon", "rsh-ui", "uninstall") + @([System.IO.Path]::GetFileNameWithoutExtension($file))
              $alive = Get-Process -ErrorAction SilentlyContinue | Where-Object { $names -contains $_.ProcessName } | ForEach-Object { "$($_.ProcessName) (pid $($_.Id))" }
              Write-Error "Smoke test TIMEOUT: $what did not exit within $timeoutSec s. Still-alive processes: $($alive -join ', ')"
              exit 1
            }
            if ($p.ExitCode -ne 0) { Write-Error "Smoke test: $what exited with code $($p.ExitCode)."; exit 1 }
            Write-Host "Smoke test: $what finished (exit 0)."
          }
          $installer = (Get-ChildItem release-staging/*-setup.exe).FullName
          $installDir = "C:\rsh-smoke-test"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          # NSIS silent install (/S); /D must be last, unquoted.
          Start-WaitOrFail $installer @("/S", "/D=$installDir") 180 "first silent install"
          foreach ($exe in @("rsh-daemon.exe", "rsh-ui.exe", "rsh-hm-sidecar.exe", "firmware-signed.bin", "HIDMaestro-LICENSE.txt")) {
            if (-not (Test-Path (Join-Path $installDir $exe))) { Write-Error "Smoke test: installed $exe not found in $installDir after silent install."; exit 1 }
          }
          Write-Host "Installed to $installDir — all three binaries + bundled firmware image + HIDMaestro LICENSE present."
          $rule = netsh advfirewall firewall show rule name="RSH" | Out-String
          if ($rule -notmatch "RSH") { Write-Error "Smoke test: firewall rule 'RSH' not found after install (netsh show rule)."; exit 1 }
          Write-Host "Firewall rule 'RSH' present after install."
          $dataDir = Join-Path $env:TEMP "rsh-smoke-data"
          $daemon = Join-Path $installDir "rsh-daemon.exe"
          Start-WaitOrFail $daemon @("--check", "--no-tray", "--no-connect", "--data-dir", $dataDir) 60 "daemon --check (IPC must answer)"
          Write-Host "Smoke test PASS: daemon --check exit 0 (IPC answers)."
          # --- Update path: install a second time over the first --------
          # Simulates the user running the new installer on a PC that
          # already has RSH: user data must survive, the registry
          # version must be the new one, and the installer must
          # restart the daemon after the update (smart installer).
          $version = "${{ steps.tag.outputs.version }}"
          $realDataDir = Join-Path $env:APPDATA "RSH"
          New-Item -ItemType Directory -Force -Path $realDataDir | Out-Null
          Set-Content -Path (Join-Path $realDataDir "smoke-marker.txt") -Value "user data must survive an update" -Encoding ASCII
          Start-WaitOrFail $installer @("/S", "/D=$installDir") 180 "second silent install (update path)"
          if (-not (Test-Path (Join-Path $realDataDir "smoke-marker.txt"))) { Write-Error "Smoke test: user data in %APPDATA%\RSH was lost by the update install."; exit 1 }
          Write-Host "User data in %APPDATA%\RSH survived the update install."
          $reg32 = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine, [Microsoft.Win32.RegistryView]::Registry32)
          $rshKey = $reg32.OpenSubKey("Software\RSH")
          $regVersion = if ($rshKey) { $rshKey.GetValue("Version") } else { $null }
          if ($regVersion -ne $version) { Write-Error "Smoke test: HKLM\Software\RSH Version is '$regVersion', expected '$version' (32-bit registry view)."; exit 1 }
          $unKey = $reg32.OpenSubKey("Software\Microsoft\Windows\CurrentVersion\Uninstall\RSH")
          $dispVersion = if ($unKey) { $unKey.GetValue("DisplayVersion") } else { $null }
          if ($dispVersion -ne $version) { Write-Error "Smoke test: Uninstall key DisplayVersion is '$dispVersion', expected '$version'."; exit 1 }
          Write-Host "Registry version is $version (RSH key + Uninstall key)."
          Start-Sleep -Seconds 3
          $daemonProc = Get-Process rsh-daemon -ErrorAction SilentlyContinue
          if (-not $daemonProc) { Write-Error "Smoke test: daemon was NOT restarted by the update install (no rsh-daemon process)."; exit 1 }
          Write-Host "Daemon restarted by the update install (pid $($daemonProc.Id))."
          # R3-19: enforcing startup measurement — launch the
          # installed UI and poll for its main window with a 60 s
          # bound. The startup SLO (launch-to-window) was unmeasured
          # everywhere: the daemon --check above only measures the
          # daemon side, and the perf-gate UI probe is record-only.
          # First run shows the setup wizard — any main window
          # counts. The UI is killed right after the probe so the
          # uninstall below is not blocked by a running UI. If this
          # fails on the runner for an environment reason (no
          # desktop session), it fails LOUDLY by design — convert
          # to record-only only with coordinator approval after
          # seeing the failure mode, never silently.
          $ui = Join-Path $installDir "rsh-ui.exe"
          $uiStart = Get-Date
          $uiProc = Start-Process -FilePath $ui -PassThru
          $windowMs = $null
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Milliseconds 500
            $uiProc.Refresh()
            if ($uiProc.MainWindowHandle -ne 0) { $windowMs = [int]((Get-Date) - $uiStart).TotalMilliseconds; break }
            if ($uiProc.HasExited) { Write-Error "Smoke test: rsh-ui.exe exited before showing a window (startup probe, R3-19)."; exit 1 }
          }
          if ($null -eq $windowMs) { Write-Error "Smoke test: rsh-ui.exe showed no main window within 60 s (startup probe, R3-19)."; taskkill /F /IM rsh-ui.exe | Out-Null; exit 1 }
          Write-Host "Smoke test: rsh-ui main window appeared after $windowMs ms (bound 60000 ms, R3-19)."
          taskkill /F /IM rsh-ui.exe | Out-Null
          Start-Sleep -Seconds 2
          taskkill /F /IM rsh-daemon.exe | Out-Null
          Start-Sleep -Seconds 2
          Start-WaitOrFail $daemon @("--check", "--no-tray", "--no-connect", "--data-dir", $dataDir) 60 "daemon --check after the update install"
          Write-Host "Smoke test PASS: update path — data kept, version $version, daemon restarted, --check exit 0."
          # The sidecar is a separate process the uninstaller also
          # kills — stop it here too so it cannot hold its exe open.
          taskkill /F /IM rsh-hm-sidecar.exe | Out-Null
          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $uninstaller)) { Write-Error "Smoke test: uninstaller not found at $uninstaller."; exit 1 }
          Start-WaitOrFail $uninstaller @("/S") 120 "silent uninstall"
          # NSIS uninstallers copy themselves to %TEMP% and the launcher
          # exits in ~60 ms — the real work happens in the copy, so
          # NOTHING may be checked right after the launcher exits:
          # run 45126016834 failed the firewall check 200 ms after the
          # launcher exited, before the copy had deleted the rule
          # (runs 45110475449 + 45117939264 failed the same way on the
          # install dir). Poll until the install dir is gone (bounded,
          # fail closed) FIRST — the rule is deleted before the files
          # in the uninstall section, so dir-gone means the copy got
          # past the rule step too — and only then check the rule.
          $gone = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Test-Path $installDir)) { $gone = $true; break }
          }
          if (-not $gone) { Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Smoke test: leftover after uninstall: $($_.FullName)" }; Get-Process rsh-* -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Smoke test: still-running RSH process: $($_.ProcessName) (pid $($_.Id))" }; Write-Error "Smoke test: install dir $installDir still present 120 s after uninstall."; exit 1 }
          $ruleAfter = netsh advfirewall firewall show rule name="RSH" | Out-String
          if ($ruleAfter -match "Rule Name:\s*RSH") { Write-Error "Smoke test: firewall rule 'RSH' still present after uninstall."; exit 1 }
          Write-Host "Smoke test PASS: uninstall removed the firewall rule and the install dir."
          # The data dir may never exist on Windows (named-pipe IPC
          # leaves no socket file, single-instance is a mutex, and
          # the startup logger writes to the default data dir, not
          # this --data-dir) — only remove it when it exists.
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          if (Test-Path (Join-Path $realDataDir "smoke-marker.txt")) { Remove-Item (Join-Path $realDataDir "smoke-marker.txt") -Force }
          # Native commands above (the uninstaller, and `netsh show
          # rule` when no rule matches — the EXPECTED outcome after
          # uninstall) can leave $LASTEXITCODE non-zero even though
          # every check above passed explicitly; the runner
          # propagates a non-zero $LASTEXITCODE as the step's exit
          # code, which failed this step in runs 43881476168 and
          # 43884546437 with no error text. All outcomes are already
          # verified above, so clear it before exiting.
          $LASTEXITCODE = 0

      - name: vJoy DLL hash (record only — never invented)
        shell: pwsh
        run: |
          $dll = Get-ChildItem "C:\Program Files*\vJoy\vJoyInterface.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { Write-Host "vJoy DLL found on runner: $(Get-FileHash $dll.FullName -Algorithm SHA256).Hash — record it in PINNED_DLL_SHA256_HEX (G-G3) if it matches the release machine." }
          else { Write-Host "vJoy is not installed on the runner (expected). PINNED_DLL_SHA256_HEX stays None until measured on the Windows release machine (G-G3) — never invented." }

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.dry_run == 'false' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $files = Get-ChildItem release-staging -File | ForEach-Object { $_.FullName }
          if ($files.Count -ne 3) { Write-Error "Expected exactly three staged files (NSIS exe + merged firmware + OTA firmware) — refusing to create a partial release."; exit 1 }
          Write-Host "Releasing 3 files:"
          $files | ForEach-Object { Write-Host "  $_" }
          gh release create $tag --title "RSH v${{ steps.tag.outputs.version }}" --notes "RSH v${{ steps.tag.outputs.version }} — NSIS installer + firmware v${{ steps.verify-firmware.outputs.fw_version }} (merged full-flash image + Ed25519-signed OTA image for the app's WebOTA flow). v2.0 redesign: Slint UI + always-on daemon (tray popup + menu, autostart, lazy-start — no UAC prompt at login). Auto-update is off for this release: no latest.json is published — download and install manually. App ships unsigned (OV cert deferred, D-R11). Uninstall keeps %APPDATA%\RSH (profiles/settings/logs) — delete it manually for a fully clean start." $files

      - name: Dry run — release NOT created
        if: ${{ github.ref_type != 'tag' && inputs.dry_run != 'false' }}
        shell: pwsh
        run: Write-Host "Dry run complete — three assets verified in release-staging/, no GitHub Release created."
