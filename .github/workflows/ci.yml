# RSH Rust — CI
#
# Phase A4 (CI first). Triggers on push + pull_request to main.
# Source of truth for the job list: TESTING-INPUT.md §9.1.
#
# ---- SKIP MAP — a skip here is NEVER a pass. Read before trusting green. ----
# Jobs skip cleanly (loud ::notice, exit 0) ONLY while their phase has not
# landed yet. As soon as the prerequisite file/dir exists, the job runs for
# real and can fail. Current expected skips (2026-11-14, Phase A):
#   fmt / clippy / test-linux / test-windows / audit
#       skip while there is no Cargo.toml at the repo root (Phase A2 lands
#       the Cargo workspace skeleton). Audit additionally FAILS (not skips)
#       if Cargo.toml exists but Cargo.lock is missing — the lockfile must
#       be committed (SECURITY-INPUT §0).
#   fuzz-quick   — skips while fuzz/ has no targets (Phase A1 creates them).
#   bench-gate   — FAIL-CLOSED while thresholds.json is missing (Phase B
#       creates it at tools/rsh-benchmarks/thresholds.json): the job
#       exits 1 with "thresholds not yet defined (Phase B)". It never
#       claims a bench pass without thresholds. Enforcement is
#       tools/rsh-benchmarks/check-thresholds.py over the criterion
#       estimates from `cargo bench -p rsh-benchmarks` (plain
#       `cargo bench` would NOT run this crate: rsh-benchmarks is a
#       workspace member but not a default member).
#   firmware     — skips while firmware/ is absent (restored in Phase D from
#       reference/firmware-v4.0.1). Runs `pio run` + merged-bin check.
#   frontend     — skips while frontend/package.json is absent (Phase E).
#   rig-gate     — skips while run-rig.sh is absent (Rust rig, Phase B/C).
#   tauri-build  — skips while src-tauri/ is absent (Phase A2/E).
#
# ---- What this workflow does NOT do (deliberately) ----
#   * No release workflow: .github/workflows/release.yml is Phase H
#     (SW-R8.4/SW-R8.5), NOT A4. No bundling/signing here — tauri-build
#     uses `tauri build --no-bundle` only.
#   * No OV code signing: deferred by user decision D-R11 (RSH-RUST-PLAN.md).
#     The app ships unsigned in v1.0.0; firmware Ed25519 signing stays
#     mandatory and lives in the Phase H release workflow, not here.
#     (CI firmware builds run WITHOUT RSH_SIGNING_KEY, so they are unsigned
#     dev builds — sign_firmware.py skips signing and does not fail.)
#   * No 4-hour soak in CI: the long soak is a release blocker (D-R14) and
#     runs in the rig (--long), not in CI.
#   * No `cargo test --workspace --release`: per TESTING-INPUT §9.1 that run
#     is required at least once before the release gate, not on every push.
#
# Toolchain: Rust stable 1.100.0 (pinned; rust-toolchain.toml in Phase A2
# pins the same). Actions verified 2026-11-14: actions/checkout@v4,
# dtolnay/rust-toolchain@stable, Swatinem/rust-cache@v2 (Marketplace),
# actions/setup-node@v4, actions/setup-python@v5.
# Linux jobs that compile Rust (clippy, test-linux) install the Tauri 2
# system libraries first (libwebkit2gtk-4.1-dev, libgtk-3-dev,
# libappindicator3-dev, librsvg2-dev, patchelf, libssl-dev): compiling the
# workspace links the Tauri/GTK stack even when no app is bundled, and
# without them gdk-sys fails with "Package gdk-3.0 was not found"
# (proven locally 2026-11-14: cargo test failed on gdk-sys in a sandbox
# without those -dev packages). No display server is needed — tests do
# not open a window.

name: RSH Rust — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust workspace present
        id: check
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; nothing to format. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        if: steps.check.outputs.run == 'true'
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust workspace present
        id: check
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; nothing to lint. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: clippy
      - name: Install Tauri Linux system libraries
        if: steps.check.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - name: cargo clippy (warnings denied)
        if: steps.check.outputs.run == 'true'
        run: cargo clippy --all-targets -- -D warnings

  test-linux:
    name: test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust workspace present
        id: check
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; no tests to run. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Install Tauri Linux system libraries
        if: steps.check.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        if: steps.check.outputs.run == 'true'
        run: cargo test --workspace

  test-windows:
    name: test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust workspace present
        id: check
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; no tests to run. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # Windows-only tests run here; on Linux they skip with a reason
      # (TESTING-INPUT §9.1).
      - name: cargo test --workspace
        if: steps.check.outputs.run == 'true'
        run: cargo test --workspace

  fuzz-quick:
    name: fuzz-quick
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check fuzz targets present
        id: check
        shell: bash
        run: |
          if [ -f fuzz/Cargo.toml ] && compgen -G "fuzz/fuzz_targets/*.rs" > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no fuzz targets yet — Phase A1 creates fuzz/ (targets: parse_stream, parse_control, pin_validator, config_blob_validator). This is a skip, not a pass; a fuzz run is never faked green."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install nightly Rust (cargo-fuzz needs nightly)
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        if: steps.check.outputs.run == 'true'
        run: cargo install cargo-fuzz --locked
      # cargo-fuzz is Unix-only (TESTING-INPUT §0.1) — Linux job only.
      # 60 s per target (Phase A4 spec). TESTING-INPUT Phase 1 mentions
      # 5 min per target in CI; the 60 s quick run is what this job does
      # — lengthening it is a Phase B/C decision, not an A4 one.
      - name: cargo fuzz (60 s per target)
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for target in fuzz/fuzz_targets/*.rs; do
            name="$(basename "$target" .rs)"
            echo "::group::fuzz target: $name"
            cargo +nightly fuzz run "$name" -- -max_total_time=60
            echo "::endgroup::"
          done

  bench-gate:
    name: bench-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check bench prerequisites
        id: check
        shell: bash
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; nothing to benchmark. This is a skip, not a pass."
            echo "state=skip" >> "$GITHUB_OUTPUT"
          elif [ -f tools/rsh-benchmarks/thresholds.json ]; then
            echo "state=run" >> "$GITHUB_OUTPUT"
          else
            echo "state=missing-thresholds" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail closed — thresholds not yet defined
        if: steps.check.outputs.state == 'missing-thresholds'
        shell: bash
        run: |
          echo "::error::thresholds not yet defined (Phase B) — bench-gate is FAIL-CLOSED: no tools/rsh-benchmarks/thresholds.json exists, so no benchmark pass can be claimed. Phase B must create thresholds.json (SW-R8.1) plus the enforcement script (tools/rsh-benchmarks/check-thresholds.py). Do not invent threshold values."
          exit 1
      - name: Install Rust 1.100.0
        if: steps.check.outputs.state == 'run'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.state == 'run'
        uses: Swatinem/rust-cache@v2
      - name: cargo bench + thresholds enforcement
        if: steps.check.outputs.state == 'run'
        shell: bash
        run: |
          set -euo pipefail
          cargo bench -p rsh-benchmarks
          python3 tools/rsh-benchmarks/check-thresholds.py

  firmware:
    name: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check firmware present
        id: check
        shell: bash
        run: |
          if [ -d firmware ] && [ -f firmware/platformio.ini ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no firmware/ yet — restored in Phase D from reference/firmware-v4.0.1 (Track A, C++ v4.0.1). This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python 3.12
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        if: steps.check.outputs.run == 'true'
        run: pip install -U platformio
      # Track A: `pio run` in firmware/. No RSH_SIGNING_KEY is set here,
      # so sign_firmware.py skips signing (dev build stays unsigned and
      # the build does NOT fail); signed release builds are Phase H.
      - name: pio run
        if: steps.check.outputs.run == 'true'
        working-directory: firmware
        run: pio run
      # Merged factory image: .pio/build/esp32dev/RSH-Firmware-DevKitV1-v<version>.bin
      # (merge_bin.py post script; bootloader + partitions + app, flash at 0x0).
      - name: Merged-bin check
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          merged=(firmware/.pio/build/esp32dev/RSH-Firmware-DevKitV1-v*.bin)
          if [ "${#merged[@]}" -eq 0 ]; then
            echo "::error::merged factory image missing: expected firmware/.pio/build/esp32dev/RSH-Firmware-DevKitV1-v<version>.bin after 'pio run' (see firmware/platformio.ini + merge_bin.py). If Phase D changes the merged-bin name/path, update this check — do not delete it."
            exit 1
          fi
          for f in "${merged[@]}"; do
            echo "merged bin: $f ($(stat -c%s "$f") bytes)"
          done

  # Phase E gate: runs the full frontend gate — lint, vitest (includes
  # the AppShell render test, the blank-window regression test: the root
  # renders with literal text present), vite build (tsc + bundle), and
  # the locale-merge parity check. No Playwright step: the frontend has
  # no playwright config/tests (E2E is a Phase F/H item, not Phase E) —
  # a Playwright step here would fail on "No tests found" and is not a
  # real gate. Do not re-add it without landing playwright tests first.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend present
        id: check
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no frontend/package.json yet — frontend lands in Phase E (Vite + Tailwind + shadcn/ui). This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js 24
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm ci
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm ci
      - name: eslint
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm run lint
      - name: vitest run
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm test
      # Blank-window regression gate (D-R15): the bundle must build and
      # the AppShell render test (above) must pass — a window that cannot
      # build or cannot render text is a fail, never a skip.
      - name: vite build (tsc + bundle)
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm run build
      # Locale parity: merged locales must match the per-screen sources.
      - name: merge-locales --check
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: node scripts/merge-locales.mjs --check
      # Frontend supply-chain gate (SECURITY-INPUT §9 / TM-R03):
      # fail on High/Critical npm advisories.
      - name: npm audit (High/Critical fail)
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check audit prerequisites
        id: check
        shell: bash
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; nothing to audit. This is a skip, not a pass."
            echo "state=skip" >> "$GITHUB_OUTPUT"
          elif [ ! -f Cargo.lock ]; then
            echo "state=missing-lock" >> "$GITHUB_OUTPUT"
          else
            echo "state=run" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail — Cargo.lock missing
        if: steps.check.outputs.state == 'missing-lock'
        shell: bash
        run: |
          echo "::error::Cargo.lock missing — the lockfile must be committed (SECURITY-INPUT §0: binary crate, lockfile mandatory). cargo audit / cargo deny cannot run without it."
          exit 1
      - name: Install Rust 1.100.0
        if: steps.check.outputs.state == 'run'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.state == 'run'
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        if: steps.check.outputs.state == 'run'
        run: cargo install cargo-audit cargo-deny --locked
      # --deny warnings also fails on unmaintained/unsound advisories
      # (TESTING-INPUT §6). Ignores, if ever needed, go in audit.toml
      # with an expiry + reason — never silently.
      - name: cargo audit --deny warnings
        if: steps.check.outputs.state == 'run'
        run: cargo audit --deny warnings
      # Policy in deny.toml (repo root): sources = crates.io only, git
      # denied; licenses = permissive allow-list (MIT/Apache-2.0/BSD
      # + narrow ecosystem extras, see deny.toml header).
      - name: cargo deny check
        if: steps.check.outputs.state == 'run'
        run: |
          test -f deny.toml || { echo "::error::deny.toml missing at repo root (Phase A4 created it — do not delete)."; exit 1; }
          cargo deny check

  rig-gate:
    name: rig-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check rig present
        id: check
        shell: bash
        run: |
          if [ -f run-rig.sh ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no run-rig.sh yet — Rust Virtual Test Rig lands in Phase B/C (TESTING-INPUT §8). This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # Quick rig gate (60 s soak + scenarios), per TESTING-INPUT §9.1.
      # Full (10-min) and long (4-h, release blocker D-R14) soaks run
      # outside CI, in the rig itself.
      - name: ./run-rig.sh (quick)
        if: steps.check.outputs.run == 'true'
        run: ./run-rig.sh

  tauri-build:
    name: tauri-build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Tauri shell present
        id: check
        shell: bash
        run: |
          if [ -d src-tauri ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no src-tauri/ yet — Tauri shell lands in Phase A2/E. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js 24
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # H4 finding #1 (fixed H5): this job used to run
      # `npm run tauri build` in `frontend/`, but there is no `tauri`
      # npm script and no `@tauri-apps/cli` in `frontend/package.json`
      # — the job could never work as written. It now installs the
      # Tauri CLI with cargo exactly like the release workflow does
      # (`cargo install tauri-cli --locked`), and runs
      # `cargo tauri build` from `src-tauri/` (the CLI resolves
      # `tauri.conf.json` there; its `beforeBuildCommand` runs
      # `npm run build` in `../frontend`, so `npm ci` below must run
      # first). No npm script or dependency was added: the CLI is a
      # build tool, not a frontend dependency.
      - name: Install Tauri CLI (cargo, like the release workflow)
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          cargo install tauri-cli --locked
          cargo tauri --version
      # Build only — no bundling, no signing in CI. Release workflow
      # (Phase H) does the bundling + installer + signed updater.
      # --no-bundle verified against the Tauri 2 CLI reference
      # (v2.tauri.app/reference/cli): "Skip the bundling step even if
      # bundle > active is true in tauri config".
      - name: npm ci (frontend dependencies for the Tauri build)
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "::error::src-tauri/ exists but frontend/package.json is missing — the Tauri frontend (Phase E) is incomplete."
            exit 1
          fi
          npm ci
      - name: cargo tauri build --no-bundle
        if: steps.check.outputs.run == 'true'
        working-directory: src-tauri
        shell: bash
        run: cargo tauri build --no-bundle
