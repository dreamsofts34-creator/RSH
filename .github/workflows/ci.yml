# RSH Rust — CI
#
# Phase A4 (CI first). Triggers on push + pull_request to main.
# Source of truth for the job list: TESTING-INPUT.md §9.1.
#
# ---- PHASE H REALITY (rewritten deep-scan Round 2, L3) ----
# Every phase has landed. The prerequisites below are all present in the
# tree, so NO job is expected to skip anymore:
#   fmt / clippy / clippy-windows / test-linux / test-windows / audit
#       Cargo.toml + Cargo.lock committed (Phase A2/H).
#   fuzz-quick   — fuzz/fuzz_targets/*.rs landed (Phase A1).
#   bench-gate   — tools/rsh-benchmarks/thresholds.json landed (Phase B).
#   firmware     — firmware/platformio.ini restored (Phase D).
#   frontend     — frontend/package.json landed (Phase E).
#   rig-gate     — tools/rsh-rig landed (Phase B/C); the job is FAIL-CLOSED
#       (deep-scan Round 2, H1): if the rig crate disappears, the job
#       FAILS, it never goes back to skipping.
#   tauri-build  — src-tauri/ landed (Phase A2/E).
#   windows-pipe-loop — F18 (v2.0.3): the REAL daemon on Windows with a
#       named-pipe client held > 10 s — the execution proof for the
#       v2.0.2 pipe loop, which the Linux rig cannot reproduce.
# The `Check ... present` steps are kept as tripwires: a skip in Phase H
# means a landed artifact vanished from the tree, and the loud ::notice
# is the signal to investigate — it is NOT a pass and NOT normal.
# (bench-gate and audit keep their fail-closed missing-prerequisite
# branches for the same reason: thresholds.json / Cargo.lock must exist.)
# The `gate` job (last job) aggregates all 13 jobs and fails unless every
# one of them reports success — it is the single required check.
#
# ---- What this workflow does NOT do (deliberately) ----
#   * No release workflow: .github/workflows/release.yml is Phase H
#     (SW-R8.4/SW-R8.5), NOT A4. No bundling/signing here — tauri-build
#     uses `tauri build --no-bundle` only.
#   * No OV code signing: deferred by user decision D-R11 (RSH-RUST-PLAN.md).
#     The app ships unsigned in v1.0.0; firmware Ed25519 signing stays
#     mandatory and lives in the Phase H release workflow, not here.
#     (CI firmware builds run WITHOUT RSH_SIGNING_KEY, so they are unsigned
#     dev builds — sign_firmware.py skips signing and does not fail.)
#   * No 4-hour soak in CI: the long soak is a release blocker (D-R14) and
#     runs in the rig (--long), not in CI. The 4-hour soak itself is
#     SKIPPED by user order 2026-11-14 14:54 — never
#     presented as passed.
#   * No `cargo test --workspace --release`: that run
#     is required at least once before the release gate, not on every push.
#     The release workflow runs it (deep-scan Round 2, H4).
#
# ---- Linux / Windows split (deep-scan Round 2, H3) ----
# v2.0 crates (REDESIGN-PLAN Phase 2/3/7): `rsh-daemon`, `rsh-ui`,
# `rsh-api`, `rsh-ipc` are workspace members and are covered by the
# Linux `--workspace --exclude rsh-app` jobs AND by the explicit
# `-p` steps in the Windows jobs below (each job also has a
# fail-closed presence check for the four crates, so a deleted crate
# fails the job instead of silently dropping out of coverage).
#
# `rsh-app` (src-tauri) is a workspace member, but its build script
# (`tauri_build::build()`) copies the `bundle.externalBin` sidecar at
# build-script time and fails with `ResourcePathNotFound` when the staged
# file for the CURRENT target triple is missing (tauri-build 2.7.4
# `copy_binaries` + tauri-utils 2.10.2 `resource_from_path` — proven
# from the bundled crate sources). The sidecar is a Windows NativeAOT
# exe and can only be staged on Windows, so NO Linux job may build
# `rsh-app`: Linux clippy/test use `--workspace --exclude rsh-app`,
# and the shell is covered by the Windows jobs (`clippy-windows`,
# `test-windows`, `tauri-build`). A bare `--workspace` on Linux would
# fail at the rsh-app build script — that is why the scope is split
# this way, not an oversight.
#
# Toolchain: Rust stable 1.100.0 (pinned; rust-toolchain.toml in Phase A2
# pins the same). Actions verified 2026-11-14: actions/checkout@v4,
# dtolnay/rust-toolchain@stable, Swatinem/rust-cache@v2 (Marketplace),
# actions/setup-node@v4, actions/setup-python@v5.
# Linux jobs that compile Rust (clippy, test-linux) install the Tauri 2
# system libraries first (libwebkit2gtk-4.1-dev, libgtk-3-dev,
# libappindicator3-dev, librsvg2-dev, patchelf, libssl-dev): compiling the
# workspace links the Tauri/GTK stack even when no app is bundled, and
# without them gdk-sys fails with "Package gdk-3.0 was not found"
# (proven locally 2026-11-14: cargo test failed on gdk-sys in a sandbox
# without those -dev packages). No display server is needed — tests do
# not open a window.

name: RSH Rust — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust workspace present
        id: check
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; nothing to format. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        if: steps.check.outputs.run == 'true'
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust workspace present
        id: check
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; nothing to lint. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: clippy
      # DS-08 (deep-scan FC-07/CI-02): libfontconfig-dev +
      # libfreetype-dev + pkg-config listed explicitly. This job also
      # compiles rsh-ui (Slint -> yeslogic-fontconfig-sys) and only
      # passed because libwebkit2gtk-4.1-dev pulls libfontconfig-dev
      # in transitively — the same Slint fontconfig dependency that
      # failed rig-gate on run 44120480671. Explicit here so a future
      # webkit packaging change cannot silently re-break this job.
      - name: Install Tauri Linux system libraries
        if: steps.check.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libudev-dev libfontconfig-dev libfreetype-dev pkg-config
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # H3 (deep-scan Round 2): `--workspace` WITHOUT `--exclude rsh-app`
      # would fail on Linux — the rsh-app build script needs the staged
      # Windows sidecar (see the header split note). `--exclude rsh-app`
      # still covers every other member, including the non-default ones
      # (rsh-benchmarks, rsh-rig); the shell itself is covered by the
      # `clippy-windows` job (-p rsh-app, sidecar staged).
      - name: Check v2.0 crates present (fail closed)
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for crate in rsh-daemon rsh-ui rsh-api rsh-ipc; do
            test -f "crates/$crate/Cargo.toml" || { echo "::error::crates/$crate/Cargo.toml missing — the v2.0 crate is a landed artifact. Restore it; do not delete this check."; exit 1; }
          done
          echo "v2.0 crates present: rsh-daemon, rsh-ui, rsh-api, rsh-ipc"
      - name: cargo clippy (warnings denied)
        if: steps.check.outputs.run == 'true'
        run: cargo clippy --workspace --exclude rsh-app --all-targets -- -D warnings

  clippy-windows:
    name: clippy (Windows, rsh-app)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust workspace present
        id: check
        shell: bash
        run: |
          if [ -f Cargo.toml ] && [ -d src-tauri ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no Cargo.toml / src-tauri yet — Tauri shell lands in Phase A2/E. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: clippy
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # The rsh-app build script validates bundle.externalBin at build
      # time, so the HIDMaestro sidecar must be staged BEFORE clippy
      # builds the shell — otherwise it fails with "resource path
      # `binaries\\rsh-hm-sidecar-...exe` doesn't exist" (same failure
      # as the release dry runs #1/#2). Shared script (M6).
      - name: Set up .NET 10 SDK
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.404"
      - name: Stage HIDMaestro sidecar (shared script)
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/ci/stage-sidecar.ps1
      # v1.0.2 Bug 6 follow-up: the stale committed frontend/dist is
      # gone, so dist must be built before any cargo build of rsh-app —
      # tauri::generate_context!() panics at compile time when
      # frontendDist does not exist (CI run 43708228362: clippy-windows
      # + test-windows failed on exactly this). The frontend job gates
      # lint/tests separately; here only the build output is needed.
      - name: Set up Node.js 24
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
      - name: Build frontend (dist required to compile rsh-app)
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build
      - name: cargo clippy -p rsh-app (warnings denied)
        if: steps.check.outputs.run == 'true'
        run: cargo clippy -p rsh-app --all-targets -- -D warnings
      # v2.0 crates (Phase 2/3/7): the daemon + Slint UI + API + IPC.
      # Explicit -p run (not covered by the -p rsh-app step above);
      # the sidecar staging above is for rsh-app only — these crates
      # do not need it at build time.
      - name: cargo clippy -p rsh-daemon -p rsh-ui -p rsh-api -p rsh-ipc (warnings denied)
        if: steps.check.outputs.run == 'true'
        run: cargo clippy -p rsh-daemon -p rsh-ui -p rsh-api -p rsh-ipc --all-targets -- -D warnings

  # DS-09 (deep-scan FC-08): Windows-target gate in CI. The local
  # windows-check step (tools/gate-checks/run-gate.sh) had no CI
  # equivalent — CI's clippy-windows covers only 5 crates, so the rest
  # of the workspace was only Windows-compiled in the release workflow
  # (i.e. at release time). The E0308 class was caught only because it
  # happened to be in a covered crate. This job runs the full workspace
  # check with --all-targets (DS-07: the local check's missing
  # --all-targets is why the ipc_api.rs test-only unused import passed
  # locally and failed clippy-windows in CI). It runs --all-targets
  # workspace-wide, unlike the local step, because the runner is real
  # Windows with MSVC: workspace --all-targets cannot run on Linux
  # (criterion -> alloca needs MSVC lib.exe; the local step runs the
  # plain workspace check plus a scoped --all-targets for the four
  # ship crates instead).
  # rsh-app is excluded, same as the local step: its build script
  # needs the staged Windows sidecar, which this job does not stage.
  windows-check:
    name: windows-check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust workspace present
        id: check
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; nothing to check. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace (excluding rsh-app) --all-targets --target x86_64-pc-windows-msvc
        if: steps.check.outputs.run == 'true'
        run: cargo check --workspace --exclude rsh-app --all-targets --target x86_64-pc-windows-msvc
      # R3-11 (Round 3 WS-2): the check above catches Windows-only
      # *compile* breakage workspace-wide, but Windows-only *lint*
      # breakage in the non-ship crates was caught only by
      # `clippy-windows` (5 crates) or at release time. This pass
      # lints the full workspace for the Windows target, so a
      # Windows-only clippy lint fails the push, not the release.
      # The release-time run stays as a backstop.
      - name: cargo clippy --workspace (excluding rsh-app) --all-targets --target x86_64-pc-windows-msvc (warnings denied)
        if: steps.check.outputs.run == 'true'
        run: cargo clippy --workspace --exclude rsh-app --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  test-linux:
    name: test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust workspace present
        id: check
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; no tests to run. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      # DS-08 (deep-scan FC-07/CI-02): mirror the rig-gate system-dep
      # set explicitly — libfontconfig-dev + libfreetype-dev +
      # pkg-config. This job used to rely on libwebkit2gtk-4.1-dev
      # pulling libfontconfig-dev in transitively; the rig-gate job has
      # no webkit install, so the same Slint fontconfig dependency
      # failed there on run 44120480671. Explicit here too, so a
      # future webkit packaging change cannot silently re-break either
      # job.
      - name: Install Tauri Linux system libraries
        if: steps.check.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libudev-dev libfontconfig-dev libfreetype-dev pkg-config
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Check v2.0 crates present (fail closed)
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for crate in rsh-daemon rsh-ui rsh-api rsh-ipc; do
            test -f "crates/$crate/Cargo.toml" || { echo "::error::crates/$crate/Cargo.toml missing — the v2.0 crate is a landed artifact. Restore it; do not delete this check."; exit 1; }
          done
          echo "v2.0 crates present: rsh-daemon, rsh-ui, rsh-api, rsh-ipc"
      - name: cargo test --workspace (excluding rsh-app on Linux)
        if: steps.check.outputs.run == 'true'
        # Same split as clippy (header note): a bare --workspace would
        # build rsh-app, whose build script fails on Linux without the
        # staged Windows sidecar. rsh-app is tested on Windows
        # (test-windows, sidecar staged); the Linux run covers the
        # other members, including the four v2.0 crates (rsh-daemon,
        # rsh-ui, rsh-api, rsh-ipc). (Deep-scan Round 2 — same root
        # cause as H3; found while fixing the clippy scope, not in the
        # audit list.)
        run: cargo test --workspace --exclude rsh-app

  test-windows:
    name: test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust workspace present
        id: check
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; no tests to run. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # Windows-only tests run here; on Linux they skip with a reason
      # (TESTING-INPUT §9.1).
      # The rsh-app build script (Tauri) validates bundle.externalBin at
      # build time, so the HIDMaestro sidecar must be staged BEFORE any
      # cargo build of the app — otherwise `cargo test --workspace` fails
      # with "resource path `binaries\\rsh-hm-sidecar-...exe` doesn't
      # exist" (release dry runs #1/#2 + first CI run, 2026-11-14).
      - name: Set up .NET 10 SDK
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.404"
      - name: Stage HIDMaestro sidecar (shared script)
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/ci/stage-sidecar.ps1
      # v1.0.2 Bug 6 follow-up: the stale committed frontend/dist is
      # gone, so dist must be built before any cargo build of rsh-app —
      # tauri::generate_context!() panics at compile time when
      # frontendDist does not exist (CI run 43708228362: clippy-windows
      # + test-windows failed on exactly this). The frontend job gates
      # lint/tests separately; here only the build output is needed.
      - name: Set up Node.js 24
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
      - name: Build frontend (dist required to compile rsh-app)
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build
      # The full --workspace run covers the four v2.0 crates
      # (rsh-daemon, rsh-ui, rsh-api, rsh-ipc) on Windows, sidecar
      # staged above; on Linux the same crates are covered by
      # test-linux (--workspace --exclude rsh-app).
      - name: cargo test --workspace
        if: steps.check.outputs.run == 'true'
        run: cargo test --workspace

  windows-pipe-loop:
    name: windows-pipe-loop
    # F18 (v2.0.3): the Windows execution test for the v2.0.2 pipe
    # loop. The Linux rig cannot reproduce a Windows named-pipe
    # failure (the user's log is the only repro evidence there), so
    # this job is the proof the bug class cannot recur: the REAL
    # daemon runs on Windows, a named-pipe client connects and HOLDS
    # the pipe for 12 s (the failing sequence — pre-fix the second
    # pipe create failed ~1 s after the first client connected, and
    # after 5 failures the daemon died and the UI respawned it), and
    # the daemon must still be alive with a second client able to
    # connect afterwards. Only F17/F18 touches this workflow's pipe
    # test — no other stream edits .github/workflows/.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check daemon crate present (fail closed)
        id: check
        shell: bash
        run: |
          if [ -d crates/rsh-daemon ] && [ -f tools/ci/windows-pipe-loop.ps1 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "state=missing-pipe-test" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail closed — pipe test missing
        if: steps.check.outputs.state == 'missing-pipe-test'
        shell: bash
        run: |
          echo "::error::crates/rsh-daemon or tools/ci/windows-pipe-loop.ps1 is missing — the Windows pipe-loop test (F18) is a landed artifact. windows-pipe-loop is FAIL-CLOSED: a missing test fails the job, it never skips. Restore the files; do not re-add a skip."
          exit 1
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # The daemon alone (no Tauri app, no sidecar, no frontend): its
      # build needs no .NET SDK or Node.js.
      - name: cargo build -p rsh-daemon
        if: steps.check.outputs.run == 'true'
        run: cargo build -p rsh-daemon
      - name: Windows pipe loop (real daemon + held client > 10 s)
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/ci/windows-pipe-loop.ps1 `
            -DaemonExe target/debug/rsh-daemon.exe `
            -DataDir "$env:TEMP\rsh-pipe-loop"

  fuzz-quick:
    name: fuzz-quick
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check fuzz targets present
        id: check
        shell: bash
        run: |
          if [ -f fuzz/Cargo.toml ] && compgen -G "fuzz/fuzz_targets/*.rs" > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no fuzz targets yet — Phase A1 creates fuzz/ (targets: parse_stream, parse_control, pin_validator, config_blob_validator). This is a skip, not a pass; a fuzz run is never faked green."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install nightly Rust (cargo-fuzz needs nightly)
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned nightly (M2): an unpinned `nightly` floats — a new
          # nightly can break cargo-fuzz without any repo change. Date
          # verified 2026-11-14 (channel manifest exists at
          # static.rust-lang.org/dist/2026-11-13/channel-rust-nightly.toml).
          toolchain: nightly-2026-11-13
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        if: steps.check.outputs.run == 'true'
        # Pinned (M2): 0.13.2 is the latest stable on crates.io, and the
        # version installed in the sandbox, 2026-11-14.
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # cargo-fuzz is Unix-only (TESTING-INPUT §0.1) — Linux job only.
      # 60 s per target (Phase A4 spec). TESTING-INPUT Phase 1 mentions
      # 5 min per target in CI; the 60 s quick run is what this job does
      # — lengthening it is a Phase B/C decision, not an A4 one.
      - name: cargo fuzz (60 s per target)
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for target in fuzz/fuzz_targets/*.rs; do
            name="$(basename "$target" .rs)"
            echo "::group::fuzz target: $name"
            cargo +nightly-2026-11-13 fuzz run "$name" -- -max_total_time=60
            echo "::endgroup::"
          done

  bench-gate:
    name: bench-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check bench prerequisites
        id: check
        shell: bash
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; nothing to benchmark. This is a skip, not a pass."
            echo "state=skip" >> "$GITHUB_OUTPUT"
          elif [ -f tools/rsh-benchmarks/thresholds.json ]; then
            echo "state=run" >> "$GITHUB_OUTPUT"
          else
            echo "state=missing-thresholds" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail closed — thresholds not yet defined
        if: steps.check.outputs.state == 'missing-thresholds'
        shell: bash
        run: |
          echo "::error::thresholds not yet defined (Phase B) — bench-gate is FAIL-CLOSED: no tools/rsh-benchmarks/thresholds.json exists, so no benchmark pass can be claimed. Phase B must create thresholds.json (SW-R8.1) plus the enforcement script (tools/rsh-benchmarks/check-thresholds.py). Do not invent threshold values."
          exit 1
      - name: Install Rust 1.100.0
        if: steps.check.outputs.state == 'run'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.state == 'run'
        uses: Swatinem/rust-cache@v2
      - name: cargo bench + thresholds enforcement
        if: steps.check.outputs.state == 'run'
        shell: bash
        run: |
          set -euo pipefail
          cargo bench -p rsh-benchmarks
          # R3-04: check-thresholds.py exits 2 (LOAD-SUSPECT) when a
          # threshold fails while the 1-min loadavg is over the bound
          # — a busy runner, not a bad product. Retry the bench +
          # check once; a second failure (any code) fails the job.
          set +e
          python3 tools/rsh-benchmarks/check-thresholds.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "bench-gate: thresholds PASS"
          elif [ "$rc" -eq 2 ]; then
            echo "::warning::bench-gate: first attempt failed under high load — retrying once (R3-04)"
            sleep 60
            cargo bench -p rsh-benchmarks
            python3 tools/rsh-benchmarks/check-thresholds.py
          else
            echo "::error::bench-gate: thresholds FAILED (exit $rc)"
            exit 1
          fi

  # R3-03 (Round 3 WS-2): the perf gate (binary sizes vs 27/34 MB,
  # `rsh-daemon --check` <= 5000 ms) had no automated runner at all —
  # locally it is record-only (debug binaries), and no workflow ever
  # ran it. This job builds the release binaries, then runs the same
  # tools/gate-checks/perf-gate.sh the local gate and release.yml
  # run, fail-closed. Thresholds live in that script; do not change
  # them here.
  perf-gate:
    name: perf-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      # rsh-ui links Slint (fontconfig/freetype) and rsh-rig's
      # transport needs libudev — same system-dep set as rig-gate.
      - name: Install system deps (libudev + fontconfig + X stack)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev xvfb xdotool libxkbcommon-x11-0 libxcb-xkb1 libfontconfig-dev libfreetype-dev pkg-config
      - name: cargo build --release (daemon + UI)
        run: cargo build --release -p rsh-daemon -p rsh-ui
      - name: perf-gate (sizes + daemon --check, fail-closed)
        shell: bash
        run: bash tools/gate-checks/perf-gate.sh --out /tmp/perf-gate-ci

  firmware:
    name: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check firmware present
        id: check
        shell: bash
        run: |
          if [ -d firmware ] && [ -f firmware/platformio.ini ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no firmware/ yet — restored in Phase D from reference/firmware-v4.0.1 (Track A, C++ v4.0.1). This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python 3.12
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        if: steps.check.outputs.run == 'true'
        # DS-73 (deep-scan FC-21): pinned to 6.2.0, matching the
        # release workflow (release.yml:311). An unpinned `-U
        # platformio` lets a new PlatformIO major silently change the
        # firmware build between CI and release.
        run: pip install "platformio==6.2.0"
      # Track A: `pio run` in firmware/. No RSH_SIGNING_KEY is set here,
      # so sign_firmware.py skips signing (dev build stays unsigned and
      # the build does NOT fail); signed release builds are Phase H.
      - name: pio run
        if: steps.check.outputs.run == 'true'
        working-directory: firmware
        run: pio run
      # Merged factory image: .pio/build/esp32dev/RSH-Firmware-DevKitV1-v<version>.bin
      # (merge_bin.py post script; bootloader + partitions + app, flash at 0x0).
      - name: Merged-bin check
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          merged=(firmware/.pio/build/esp32dev/RSH-Firmware-DevKitV1-v*.bin)
          if [ "${#merged[@]}" -eq 0 ]; then
            echo "::error::merged factory image missing: expected firmware/.pio/build/esp32dev/RSH-Firmware-DevKitV1-v<version>.bin after 'pio run' (see firmware/platformio.ini + merge_bin.py). If Phase D changes the merged-bin name/path, update this check — do not delete it."
            exit 1
          fi
          for f in "${merged[@]}"; do
            echo "merged bin: $f ($(stat -c%s "$f") bytes)"
          done
      # R2-48 (DS-64): WDT config assertion — the shipped build's
      # watchdog config must be what the code assumes (5 s timeout,
      # panic-on-timeout, loop + sample tasks subscribed and fed).
      # Runs AFTER `pio run` (it inspects the built .elf/.bin + the
      # Arduino-core sdkconfig the precompiled IDF was built with).
      # What it cannot prove is documented in the script header: WDT
      # actually firing on a real board needs a board test, not CI.
      - name: WDT config check (R2-48)
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: bash firmware/tools/check-wdt-config.sh

  # Phase E gate: runs the full frontend gate — lint, vitest (includes
  # the AppShell render test, the blank-window regression test: the root
  # renders with literal text present), vite build (tsc + bundle), and
  # the locale-merge parity check. No Playwright step: the frontend has
  # no playwright config/tests (E2E is a Phase F/H item, not Phase E) —
  # a Playwright step here would fail on "No tests found" and is not a
  # real gate. Do not re-add it without landing playwright tests first.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend present
        id: check
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no frontend/package.json yet — frontend lands in Phase E (Vite + Tailwind + shadcn/ui). This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js 24
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
      - name: npm ci
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm ci
      - name: eslint
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm run lint
      - name: vitest run
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm test
      # Blank-window regression gate (D-R15): the bundle must build and
      # the AppShell render test (above) must pass — a window that cannot
      # build or cannot render text is a fail, never a skip.
      - name: vite build (tsc + bundle)
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm run build
      # Locale parity: merged locales must match the per-screen sources.
      - name: merge-locales --check
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: node scripts/merge-locales.mjs --check
      # Frontend supply-chain gate (SECURITY-INPUT §9 / TM-R03):
      # fail on High/Critical npm advisories, except the documented
      # no-fix-available allowlist in scripts/npm-audit-gate.mjs
      # (GHSA-fc5q-39xc-vjpf: picomatch, no fixed release exists yet).
      - name: npm audit (High/Critical fail)
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: node scripts/npm-audit-gate.mjs

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check audit prerequisites
        id: check
        shell: bash
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::notice::SKIP: no Cargo.toml yet — Rust workspace lands in Phase A2; nothing to audit. This is a skip, not a pass."
            echo "state=skip" >> "$GITHUB_OUTPUT"
          elif [ ! -f Cargo.lock ]; then
            echo "state=missing-lock" >> "$GITHUB_OUTPUT"
          else
            echo "state=run" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail — Cargo.lock missing
        if: steps.check.outputs.state == 'missing-lock'
        shell: bash
        run: |
          echo "::error::Cargo.lock missing — the lockfile must be committed (SECURITY-INPUT §0: binary crate, lockfile mandatory). cargo audit / cargo deny cannot run without it."
          exit 1
      - name: Install Rust 1.100.0
        if: steps.check.outputs.state == 'run'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.state == 'run'
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        if: steps.check.outputs.state == 'run'
        # Pinned (M2): 0.23.0 / 0.20.2 are the latest stable versions on
        # crates.io, and the versions installed in the sandbox, 2026-11-14.
        # One install per tool: `cargo install --version` applies to a
        # single crate, so a combined install cannot pin both.
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      # --deny warnings also fails on unmaintained/unsound advisories
      # (TESTING-INPUT §6). Ignores, if ever needed, go in audit.toml
      # with an expiry + reason — never silently.
      # H2 (deep-scan Round 2): `cargo audit` exits 0 even when the yanked
      # check never completed — the output then contains 612×
      # "error: couldn't check if the package is yanked: registry: request
      # could not be completed in the allotted timeframe" (Phase H gate,
      # 7th consecutive phase; reproduced locally 2026-11-14). Exit 0 is
      # NOT a pass for the yanked check, so this step retries (3 attempts,
      # 30 s apart — the timeouts are transient registry slowness) and
      # FAILS if the yanked verdict is still missing after the last
      # attempt. `deny.toml` sets yanked = "deny" on the same basis: the
      # retry makes the registry check reliable in CI, where the registry
      # is reachable (the sandbox timeouts are a sandbox-network limit).
      - name: cargo audit --deny warnings (fail-closed yanked check)
        if: steps.check.outputs.state == 'run'
        shell: bash
        run: |
          set -euo pipefail
          audit_out="$(mktemp)"
          trap 'rm -f "$audit_out"' EXIT
          attempt=0
          while [ "$attempt" -lt 3 ]; do
            attempt=$((attempt + 1))
            echo "cargo audit attempt $attempt/3"
            audit_rc=0
            cargo audit --deny warnings >"$audit_out" 2>&1 || audit_rc=$?
            if grep -q "couldn't check if the package is yanked" "$audit_out"; then
              echo "::warning::cargo audit attempt $attempt: yanked check incomplete (registry timeout) — retrying..."
              sleep 30
              continue
            fi
            cat "$audit_out"
            exit "$audit_rc"
          done
          echo "::error::cargo audit yanked check incomplete after 3 attempts — no yanked verdict, failing closed (see deny.toml yanked = \"deny\")."
          cat "$audit_out"
          exit 1
      # Policy in deny.toml (repo root): sources = crates.io only, git
      # denied; licenses = permissive allow-list (MIT/Apache-2.0/BSD
      # + narrow ecosystem extras, see deny.toml header).
      - name: cargo deny check
        if: steps.check.outputs.state == 'run'
        run: |
          test -f deny.toml || { echo "::error::deny.toml missing at repo root (Phase A4 created it — do not delete)."; exit 1; }
          cargo deny check

  rig-gate:
    name: rig-gate
    runs-on: ubuntu-latest
    # CI runners run the rig ~2x slower than the dev box: the 300 s
    # scenarios + full quick suite need ~35 min; 30 min cancelled
    # run 44170745634 mid-flight (two scenarios still running).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # H1 (deep-scan Round 2): the old job skipped while `run-rig.sh`
      # was absent — but there never was a run-rig.sh; the rig lives at
      # tools/rsh-rig (Phase B/C). The predicate now checks the real rig
      # crate, and the job is FAIL-CLOSED: if the rig disappears from
      # the tree, the job FAILS instead of silently skipping. No
      # run-rig.sh wrapper was added — `cargo run -p rsh-rig` is the
      # rig's own entry point (tools/rsh-rig/src/main.rs).
      - name: Check rig present (fail closed)
        id: check
        shell: bash
        run: |
          if [ -d tools/rsh-rig ] && [ -f tools/rsh-rig/Cargo.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "state=missing-rig" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail closed — rig missing
        if: steps.check.outputs.state == 'missing-rig'
        shell: bash
        run: |
          echo "::error::tools/rsh-rig is missing — the Virtual Test Rig (Phase B/C) is a landed artifact. rig-gate is FAIL-CLOSED (deep-scan Round 2, H1): a missing rig fails the job, it never skips. Restore tools/rsh-rig; do not re-add a skip."
          exit 1
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # rsh-rig pulls rsh-transport -> serialport -> libudev-sys,
      # which needs the system libudev headers (pkg-config). The
      # test (Linux) job installs the same package; rig-gate had no
      # install step and failed on a fresh runner (run 44047905469).
      # CI follow-up (run 44105260838): the F17 lifecycle checks
      # also need the X stack the rig stages under — Xvfb + xdotool
      # (the only external commands lifecycle_checks.rs invokes,
      # via `which` in XvfbSession::start) plus libxkbcommon-x11-0
      # + libxcb-xkb1 (winit panics at startup without the xkbcommon
      # library); libxdo3/libxtst6 are xdotool's runtime deps. The
      # same set is documented in the module header of
      # tools/rsh-rig/src/lifecycle_checks.rs. Without it, 9 F17
      # checks failed with "xdotool missing" / "Xvfb did not start"
      # / "staging failed" — environment gaps, not product bugs.
      # DS-08 (deep-scan FC-07/CI-02): rig-gate failed on run
      # 44120480671 because yeslogic-fontconfig-sys needs fontconfig
      # (pkg-config) and nothing on this line provided it — the rig
      # never ran. libfontconfig-dev is the fix; libfreetype-dev +
      # pkg-config are defensive (Slint's font stack wants both, and
      # pkg-config itself must exist for the .pc lookup). test-linux
      # only passed by accident (libwebkit2gtk-4.1-dev pulls
      # libfontconfig-dev transitively) — it now lists the same set
      # explicitly instead of relying on the transitive pull.
      - name: Install system deps (libudev + X stack)
        if: steps.check.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev xvfb xdotool libxkbcommon-x11-0 libxcb-xkb1 libxdo3 libxtst6 libfontconfig-dev libfreetype-dev pkg-config
      # F17 lifecycle checks stage the real debug binaries
      # (target/debug/rsh-ui, rsh-daemon, rsh-fake-daemon) — the
      # local gate (tools/gate-checks/run-gate.sh) builds them first,
      # but CI never did, so on run 44105260838 the checks failed
      # with "target/debug/rsh-daemon not built — run cargo build
      # -p rsh-daemon" / "staging failed". Same build as the local
      # gate, before the rig runs.
      - name: Build lifecycle binaries (rsh-ui, rsh-daemon, rsh-fake-daemon)
        if: steps.check.outputs.run == 'true'
        run: cargo build -p rsh-ui -p rsh-daemon -p rsh-fake-daemon
      # Quick rig gate (60 s soak + scenarios).
      # Full (10-min) and long (4-h, release blocker D-R14) soaks run
      # outside CI, in the rig itself. (The 4-h soak is SKIPPED by user
      # order 2026-11-14 14:54 — never claimed as passed.)
      - name: cargo run -p rsh-rig -- --mode quick
        if: steps.check.outputs.run == 'true'
        run: cargo run -p rsh-rig -- --mode quick

  # R3-01 (Round 3 WS-2): `rsh-gate-ui` (11 headless UI checks:
  # slider/wizard/theme/tray/banner pixels + Extras card size /
  # OFF no-input / responsive gaps) never ran in CI — the only
  # caller was the local gate. The checks compile the real .slint
  # files with slint-interpreter on the testing backend (software
  # renderer — no X, no window manager, no daemon), so this is a
  # plain Linux job; the Xvfb + system-dep set is installed anyway
  # (same set as rig-gate) so the job stays runnable if a check
  # ever needs a display, and `xvfb-run -a` wraps the run.
  ui-gate:
    name: ui-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install system deps (libudev + X stack)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev xvfb xdotool libxkbcommon-x11-0 libxcb-xkb1 libfontconfig-dev libfreetype-dev pkg-config
      - name: cargo run -p rsh-gate-ui (11 headless UI checks)
        run: xvfb-run -a cargo run -p rsh-gate-ui

  tauri-build:
    name: tauri-build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Tauri shell present
        id: check
        shell: bash
        run: |
          if [ -d src-tauri ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SKIP: no src-tauri/ yet — Tauri shell lands in Phase A2/E. This is a skip, not a pass."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js 24
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
      - name: Install Rust 1.100.0
        if: steps.check.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Cache Cargo dependencies
        if: steps.check.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # H4 finding #1 (fixed H5): this job used to run
      # `npm run tauri build` in `frontend/`, but there is no `tauri`
      # npm script and no `@tauri-apps/cli` in `frontend/package.json`
      # — the job could never work as written. It now installs the
      # Tauri CLI with cargo exactly like the release workflow does
      # (`cargo install tauri-cli --version 2.12.4 --locked`), and runs
      # `cargo tauri build` from `src-tauri/` (the CLI resolves
      # `tauri.conf.json` there; its `beforeBuildCommand` runs
      # `npm run build` in `../frontend`, so `npm ci` below must run
      # first). No npm script or dependency was added: the CLI is a
      # build tool, not a frontend dependency.
      - name: Install Tauri CLI (cargo, like the release workflow)
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          # Pinned (M2): 2.12.4 is the latest stable 2.x on crates.io
          # (3.0.0-alpha.6 exists — do NOT pin a 3.0 alpha for a 2.x app).
          cargo install tauri-cli --version 2.12.4 --locked
          cargo tauri --version
      # Build only — no bundling, no signing in CI. Release workflow
      # (Phase H) does the bundling + installer + signed updater.
      # --no-bundle verified against the Tauri 2 CLI reference
      # (v2.tauri.app/reference/cli): "Skip the bundling step even if
      # bundle > active is true in tauri config".
      - name: npm ci (frontend dependencies for the Tauri build)
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "::error::src-tauri/ exists but frontend/package.json is missing — the Tauri frontend (Phase E) is incomplete."
            exit 1
          fi
          npm ci
      # The rsh-app build script (Tauri) validates bundle.externalBin at
      # build time, so the HIDMaestro sidecar must be staged BEFORE the
      # build — otherwise `cargo tauri build` fails with "resource path
      # `binaries\\rsh-hm-sidecar-...exe` doesn't exist" (first CI run,
      # 2026-11-14). Shared script (M6) — same staging as test-windows
      # and the release workflow.
      - name: Set up .NET 10 SDK
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.404"
      - name: Stage HIDMaestro sidecar (shared script)
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/ci/stage-sidecar.ps1
      - name: cargo tauri build --no-bundle
        if: steps.check.outputs.run == 'true'
        working-directory: src-tauri
        shell: bash
        run: cargo tauri build --no-bundle

  # M6 (deep-scan Round 2): single aggregator for branch protection.
  # GitHub runs `needs` jobs independently; without this job a PR could
  # look green while a required job was skipped or failed. The gate
  # fails unless EVERY needed job reports success — a skip, failure or
  # cancellation anywhere fails the gate (in Phase H no job is expected
  # to skip; see the header note).
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - fmt
      - clippy
      - clippy-windows
      - test-linux
      - test-windows
      - fuzz-quick
      - bench-gate
      - firmware
      - frontend
      - audit
      - rig-gate
      - ui-gate
      - perf-gate
      - tauri-build
      - windows-pipe-loop
      - windows-check
    if: always()
    steps:
      - name: All CI jobs must have succeeded
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_JSON'])
          bad = {name: job['result'] for name, job in needs.items() if job['result'] != 'success'}
          if bad:
              print('::error::CI gate FAILED — these jobs did not succeed: ' + ', '.join(f'{n}={r}' for n, r in sorted(bad.items())))
              sys.exit(1)
          print(f\"CI gate PASSED — all {len(needs)} jobs succeeded.\")
          "
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
