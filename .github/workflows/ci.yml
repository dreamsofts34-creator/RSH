# RSH — CI (WP6 / Software Plan SW-1, Plan v2.3 WP6/T6)
#
# Har push / pull request par: dotnet build + test, C++ host tests,
# Python reference scripts, firmware build, benchmark gate.
# CI ke baghair kisi phase ka "tests pass" gate count nahi hoga.
#
# !!! PEHLI RUN — VIRTUAL TEST RIG MEIN !!!
# GitHub par push abhi MANA hai (local-only rule), is liye ye workflow
# GitHub Actions par run NAHI hoga. Pehli green run Virtual Test Rig
# (~/workspace/projects/rsh/test-env/) ke andar hogi — har job ke header
# comment mein likha hai ke wo rig ke andar kaise chalega. Jab push allow
# hoga, ye workflow bina tabdeeli ke GitHub par bhi chalega.
#
# Release workflow (.github/workflows/release.yml) se farq:
# release.yml sirf tag v* par release banata hai; ye CI har push/PR par
# chalta hai aur kuch release nahi karta.
#
# NOTE (QA correction — brief mein ubuntu-latest likha tha):
# `dotnet` job windows-latest par hai, kyunke RSH.App WPF hai
# (net10.0-windows, UseWPF) aur RSH.VJoy.Tests bhi net10.0-windows hai.
# `dotnet build` Linux par bhi compile ho jata (EnableWindowsTargeting),
# lekin `dotnet test` Windows-targeted test assembly ko ubuntu-latest par
# EXECUTE nahi kar sakta — ubuntu par dotnet job pehle din se red hota.
# release.yml ka software job bhi windows-latest use karta hai.
# Host tests, firmware aur benchmark-gate ubuntu-latest par hain.

name: RSH — CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # dotnet — RSH app + tests (Windows runner; WPF ki wajah se)
  # Rig mein: Windows runner/VM par yehi steps chalenge
  #   (setup-dotnet 10.0.100 -> dotnet build -> dotnet test x2).
  # ------------------------------------------------------------------
  dotnet:
    name: .NET build + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0.100
        uses: actions/setup-dotnet@v4
        with:
          # software/global.json bhi 10.0.100 pin karta hai
          # (rollForward latestPatch); yahan explicit pin taake
          # global.json ke baghair bhi SDK wahi rahe.
          dotnet-version: "10.0.100"

      - name: Verify SDK pin matches global.json
        shell: pwsh
        run: |
          $sdk = (dotnet --version).Trim()
          $pinned = (Get-Content software/global.json | ConvertFrom-Json).sdk.version
          Write-Host "SDK: $sdk, global.json pin: $pinned"
          # NOTE (2026-11-13): ye check pehle exact-equality tha, lekin
          # global.json mein rollForward latestPatch hai — runner par naye
          # patches preinstalled hote hain, is liye dotnet --version pin se
          # naya de sakta hai. Pin minimum version hai, exact nahi.
          if ([System.Version]$sdk -lt [System.Version]$pinned) { throw "SDK $sdk < global.json pin $pinned" }

      - name: Build solution
        # Warnings-as-errors: production code (src/) ke liye pehle se ON hai
        # via software/src/Directory.Build.props (TreatWarningsAsErrors=true),
        # is liye plain build hi src warnings par fail hoga.
        # Solution-wide `-p:TreatWarningsAsErrors=true` yahan NAHI lagaya:
        # test projects mein pehle se 2 mojood warnings hain — wo fix hone
        # tak solution-wide flag CI ko red kar dega. Un 2 warnings ka fix
        # alag follow-up hai; us ke baad solution-wide flag lagaya ja sakta hai.
        run: dotnet build software/RSH.slnx -c Release --nologo

      # Test counts (T5): har test project apne step mein — breakdown ke
      # saath, koi single gumrah-kun aggregate number nahi ("536 checks"
      # jaisa). Har step ka console summary us project ki Passed/Failed/
      # Skipped ginti hai; fail hone par pata chalta hai kaunsa project fail hua.
      - name: Test RSH.Tests (Core)
        run: dotnet test software/tests/RSH.Tests/RSH.Tests.csproj -c Release --no-build --nologo

      - name: Test RSH.VJoy.Tests (vJoy layout)
        run: dotnet test software/tests/RSH.VJoy.Tests/RSH.VJoy.Tests.csproj -c Release --no-build --nologo

  # ------------------------------------------------------------------
  # host-tests — C++ host tests + Python reference scripts (Linux)
  # Rig mein: Linux runner par yehi steps; koi Arduino/board nahi chahiye.
  # ------------------------------------------------------------------
  host-tests:
    name: C++ host tests + Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: C++ host tests (run_tests.sh)
        run: sh tests-host/run_tests.sh

      - name: C++ host tests — strict flags (T6)
        # NOTE: run_tests.sh khud sakht flags ke baghair compile karta hai
        # (plain `g++ -std=c++17 -O1`). Script ko chhede baghair CI yahan
        # apna strict compile + run karta hai; run_tests.sh mein flags
        # dalna firmware/host-test team ka follow-up hai.
        run: |
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I firmware/rsh -o /tmp/rsh_host_tests_strict tests-host/test_main.cpp
          /tmp/rsh_host_tests_strict

      # Har Python script apne step mein taake fail hone par pata chale
      # kaunsi fail hui (ek combined step mein attribution kho jati).
      - name: Python — pin rules reference
        run: python3 -I tests-host/pin_rules_ref.py

      - name: Python — protocol v2 golden vectors
        run: python3 -I tests-host/protocol_v2_vectors.py

      - name: Python — packet cross-verify
        run: python3 -I tests-host/verify_packet.py

  # ------------------------------------------------------------------
  # firmware — ESP32 build + merged-bin check (Linux)
  # Rig mein: Linux runner par pio run; board/flash ki zaroorat nahi.
  # ------------------------------------------------------------------
  firmware:
    name: Firmware (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ hashFiles('firmware/rsh/platformio.ini') }}

      - name: Verify platform pin (espressif32@6.9.0)
        run: grep -Fq 'platform = espressif32@6.9.0' firmware/rsh/platformio.ini

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        working-directory: firmware/rsh
        run: pio run

      - name: Check merged factory bin EXISTS (silent-merge bug guard)
        # merge_bin.py (post: script) koi input missing ho to stderr par
        # "skipping merge" likh kar KHAMOSHI se return karta hai — pio run
        # phir bhi green rehta hai aur merged bin bane baghair reh jata hai.
        # Is liye CI mein merged bin ka existence check LAZMI hai: agar
        # RSH-Firmware-DevKitV1-v*.bin na bana ho to job FAIL hogi.
        run: |
          BUILD_DIR="firmware/rsh/.pio/build/esp32dev"
          ls -la "$BUILD_DIR"
          test -f "$BUILD_DIR/firmware.bin" || { echo "MISSING: firmware.bin (app-only OTA image)"; exit 1; }
          MERGED=$(ls "$BUILD_DIR"/RSH-Firmware-DevKitV1-v*.bin 2>/dev/null | head -n 1)
          if [ -z "$MERGED" ]; then
            echo "MISSING: merged factory bin RSH-Firmware-DevKitV1-v*.bin — merge_bin.py khamoshi se fail hua?"
            exit 1
          fi
          echo "Merged factory bin OK: $MERGED"
          sha256sum "$BUILD_DIR"/*.bin

  # ------------------------------------------------------------------
  # benchmark-gate — benchmarks + thresholds (Linux)
  # Rig mein: Linux runner par; dotnet job green hone ke baad hi chalega.
  # ------------------------------------------------------------------
  benchmark-gate:
    name: Benchmark gate
    runs-on: ubuntu-latest
    needs: [dotnet]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0.100
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.100"

      - name: Run benchmarks (short CI soak)
        # Full soak (60 s default) local/manual run ke liye hai;
        # CI mein --soak-sec 10 taake gate halka rahe.
        # Output benchmarks.log mein bhi jata hai — agla step (Threshold gate)
        # usi log ko thresholds.json se dobara milata hai (sirf Program.cs ke
        # apne exit code par bharosa nahi — gate step khud enforcing hai).
        run: |
          dotnet run --project software/tools/RSH.Benchmarks -c Release -- --soak-sec 10 > benchmarks.log 2>&1
          rc=$?
          cat benchmarks.log
          exit $rc

      - name: Threshold gate
        # ENFORCING (Phase C QA — pehle sirf print karta tha, TODO ke sath).
        # 1) thresholds.json lazmi hai (TBD era khatam — file na ho to FAIL).
        # 2) benchmarks.log mein "--- Gate ---" section lazmi hai, aur us mein
        #    koi [FAIL] nahi hona chahiye + "GATE PASS" lazmi hai.
        # 3) Aazad dobara-jaanch: log ki [Parse]/[Pipe]/[E2E]/[Soak] lines se
        #    numbers nikal kar thresholds.json ke khilaf compare karo — taake
        #    Program.cs ka exit code khamoshi se badal bhi jaye to gate phir
        #    bhi breach par FAIL ho. Koi bhi breach = exit 1 = job red.
        # E2E checks sirf tab jab E2E chala ho (UDP loopback band mahol mein
        # SKIP hota hai — us surat mein wo checks SKIP, baqi sab enforcing).
        run: |
          python3 - <<'EOF'
          import json, re, sys
          from pathlib import Path

          failures, skips, passes = [], [], []
          def check(name, ok, detail):
              (passes if ok else failures).append(f"{name}: {detail}")
          def skip(name, detail):
              skips.append(f"{name}: {detail}")

          thresholds_path = Path("software/tools/RSH.Benchmarks/thresholds.json")
          log_path = Path("benchmarks.log")
          if not thresholds_path.is_file():
              print(f"FAIL: thresholds.json nahi hai ({thresholds_path}) — gate enforce nahi ho sakta.")
              sys.exit(1)
          try:
              thresholds = json.loads(thresholds_path.read_text())
          except Exception as e:
              print(f"FAIL: thresholds.json parse nahi hua: {e}")
              sys.exit(1)
          if not log_path.is_file():
              print("FAIL: benchmarks.log nahi hai — 'Run benchmarks' step chala hi nahi?")
              sys.exit(1)
          log = log_path.read_text(errors="replace")

          # --- Gate section (Program.cs ki apni verdict) ---
          if "--- Gate ---" not in log:
              print("FAIL: benchmarks.log mein '--- Gate ---' section nahi — benchmarks mukammal nahi chale.")
              sys.exit(1)
          gate_section = log.split("--- Gate ---", 1)[1]
          fail_lines = re.findall(r"\[FAIL\] (.+)", gate_section)
          if fail_lines:
              failures.append(f"benchmark gate FAIL lines: {'; '.join(fail_lines)}")
          if "GATE PASS" not in gate_section:
              failures.append("benchmark gate mein 'GATE PASS' nahi — gate FAIL ya adhura.")

          # --- Aazad dobara-jaanch: numbers vs thresholds.json ---
          def num(pat, text, label):
              m = re.search(pat, text)
              if not m:
                  failures.append(f"{label}: log mein number nahi mila (pattern {pat!r}) — benchmark adhura?")
                  return None
              return float(m.group(1))
          def need(key):
              if key not in thresholds:
                  failures.append(f"thresholds.json mein '{key}' nahi — fail-closed.")
                  return None
              return float(thresholds[key])

          v = num(r"\((\d+) ns/packet\)", log, "parse-ns")
          t = need("parseNsPerPacketMax")
          if v is not None and t is not None: check("parse-ns", v <= t, f"{v:.0f} ns/packet <= {t:.0f}")
          v = num(r"\(([\d.]+) B/packet\)", log, "parse-alloc")
          t = need("parseAllocBytesPerPacketMax")
          if v is not None and t is not None: check("parse-alloc", v <= t, f"{v:.2f} B/packet <= {t:.2f}")
          v = num(r"\((\d+) ns/tick\)", log, "pipe-ns")
          t = need("pipeNsPerTickMax")
          if v is not None and t is not None: check("pipe-ns", v <= t, f"{v:.0f} ns/tick <= {t:.0f}")
          v = num(r"\(([\d.]+) B/tick\)", log, "pipe-alloc")
          t = need("pipeAllocBytesPerTickMax")
          if v is not None and t is not None: check("pipe-alloc", v <= t, f"{v:.2f} B/tick <= {t:.2f}")

          if "[E2E]    SKIP" in log:
              skip("e2e-loss/e2e-age/e2e-pacing", "UDP loopback is mahol mein band — E2E SKIP (fail nahi)")
          else:
              v = num(r"lost=(\d+)", log, "e2e-loss")
              t = need("e2eLostMax")
              if v is not None and t is not None: check("e2e-loss", v <= t, f"lost={v:.0f} <= {t:.0f}")
              v = num(r"latest-age avg=[\d.]+ ms p99=([\d.]+) ms", log, "e2e-age")
              t = need("e2eAgeP99MsMax")
              if v is not None and t is not None: check("e2e-age", v <= t, f"age p99={v:.1f} ms <= {t:.0f} ms")
              v = num(r"send-gap avg=[\d.]+ ms p99=([\d.]+) ms", log, "e2e-pacing")
              t = need("e2eSendGapP99MsMax")
              if v is not None and t is not None: check("e2e-pacing", v <= t, f"send-gap p99={v:.2f} ms <= {t:.2f} ms")

          v = num(r"\(~([\d.]+)/s\)", log, "soak-rate")
          t = need("soakTicksPerSecMin")
          if v is not None and t is not None: check("soak-rate", v >= t, f"{v:.0f} ticks/s >= {t:.0f}")
          v = num(r"avg tick \(soak-only\)=([\d.]+) us", log, "soak-avg-tick")
          t = need("soakAvgTickUsMax")
          if v is not None and t is not None: check("soak-avg-tick", v <= t, f"avg tick {v:.1f} us <= {t:.0f} us")
          v = num(r"max tick \(lifetime, warm-up samet\)=(\d+) us", log, "soak-max-tick")
          t = need("soakMaxTickUsMax")
          if v is not None and t is not None: check("soak-max-tick", v <= t, f"max tick {v:.0f} us <= {t:.0f} us")
          v = num(r"late=\d+ \(([\d.]+) ?%\)", log, "soak-late")
          t = need("soakLateTickRatioMax")
          if v is not None and t is not None: check("soak-late", v / 100.0 <= t, f"late {v:.1f}% <= {t * 100:.0f}%")
          v = num(r"steady-state \(2nd half\)=([\d.]+) B", log, "soak-alloc")
          t = need("soakAllocBytesPerTickSecondHalfMax")
          if v is not None and t is not None: check("soak-alloc", v <= t, f"steady-state alloc {v:.1f} B/tick <= {t:.0f} B/tick")
          v = num(r"\(growth ([\d.\-]+) MB\)", log, "soak-heap")
          t = need("soakHeapGrowthMbMax")
          if v is not None and t is not None: check("soak-heap", v <= t, f"heap growth {v:.2f} MB <= {t:.1f} MB")
          v = num(r"Gen2 collections=(\d+)", log, "soak-gen2")
          t = need("soakGen2CollectionsMax")
          if v is not None and t is not None: check("soak-gen2", v <= t, f"Gen2 collections {v:.0f} <= {t:.0f}")
          v = num(r"working set [\d.]+ MB -> ([\d.]+) MB", log, "soak-ws")
          t = need("soakWorkingSetMbMax")
          if v is not None and t is not None: check("soak-ws", v <= t, f"WS end {v:.1f} MB <= {t:.0f} MB")

          print("--- Threshold gate (enforcing, Phase C QA) ---")
          for p in passes: print(f"[PASS] {p}")
          for s in skips: print(f"[SKIP] {s}")
          for f in failures: print(f"[FAIL] {f}")
          if failures:
              print(f"=== THRESHOLD GATE FAIL ({len(failures)} breach, {len(passes)} pass, {len(skips)} skip) ===")
              sys.exit(1)
          print(f"=== THRESHOLD GATE PASS ({len(passes)} pass, {len(skips)} skip) ===")
          EOF
