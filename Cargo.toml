[workspace]
resolver = "2"
members = [
    "crates/rsh-api",
    "crates/rsh-ipc",
    "crates/rsh-protocol",
    "crates/rsh-daemon",
    "crates/rsh-ui",
    "crates/rsh-engine",
    "crates/rsh-transport",
    "crates/rsh-security",
    "crates/rsh-profiles",
    "crates/rsh-telemetry",
    "crates/rsh-output",
    "crates/rsh-output-hidmaestro",
    "crates/rsh-led",
    "crates/rsh-app-core",
    # A6 baseline harness (criterion benches, rsh-protocol only).
    "tools/rsh-benchmarks",
    # Virtual Test Rig (Phase H2, SW-R8.2).
    "tools/rsh-rig",
    # Tauri shell. It IS a workspace member (single Cargo.lock), but it can
    # only compile where the WebView2/webkit system libraries exist (Windows,
    # or Linux with the Tauri system dependencies installed). This Linux
    # sandbox has no webkit2gtk dev libraries, so `cargo build --workspace`
    # fails here on `rsh-app` only — see README.md. `default-members` below
    # keeps the plain `cargo build` / `cargo test` commands working on Linux
    # for the nine library crates.
    "src-tauri",
    # v2.0.2 UI gate checks (Slint interpreter + testing backend).
    # Not in default-members: it is only built by tools/gate-checks/run-gate.sh.
    "tools/gate-checks/rsh-gate-ui",
    # v2.0.3 F17 test fixture (controllable fake daemon). Not in
    # default-members: only the rig gate builds it.
    "tools/rsh-fake-daemon",
]
default-members = [
    "crates/rsh-api",
    "crates/rsh-ipc",
    "crates/rsh-daemon",
    "crates/rsh-ui",
    "crates/rsh-protocol",
    "crates/rsh-engine",
    "crates/rsh-transport",
    "crates/rsh-security",
    "crates/rsh-profiles",
    "crates/rsh-telemetry",
    "crates/rsh-output",
    "crates/rsh-output-hidmaestro",
    "crates/rsh-led",
    "crates/rsh-app-core",
]

[workspace.package]
version = "2.0.15"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Exact pins (Cargo.lock committed). Never float: upgrades are deliberate PRs.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
mdns-sd = "=0.19.1"
keyring = "=4.2.0"
serialport = "=4.10.1"
dirs = "=7.0.0"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
criterion = "=0.8.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.14.1"
# M13 (deep-scan Round 2): native file picker for the Setup firmware
# step — Rust crate version matches the frontend
# `@tauri-apps/plugin-dialog@2.8.4` exactly (JS/Rust pairs ship in
# lock-step for the official plugins).
tauri-plugin-dialog = "=2.8.4"
tauri-build = "=2.7.4"
# Windows-only (the `windows` crate does NOT compile on
# Linux, so it is only ever a `[target.'cfg(windows)'.dependencies]`
# entry; never a plain dependency). Features are named per use site.
windows = { version = "=0.62.2", default-features = false }
semver = "=1.0.28"
# H1 sidecar trust boundary: OS CSPRNG for the loopback token and
# constant-time comparison for its echo (both already in Cargo.lock
# as transitive deps; pinned exactly like every other workspace dep).
getrandom = "=0.3.4"
subtle = "=2.6.1"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.lints.rust]
missing_docs = "warn"

[profile.release]
# PERF-RESEARCH F-3 (§6 item 1): no release tuning shipped — the
# release binaries were unstripped (daemon 36,654,936 B + UI
# 42,330,392 B, ~80 MB installed) with no LTO. strip + fat LTO +
# a single codegen unit shrink both binaries and speed cold start
# (less page-in); the cost is slower release/CI builds — the
# release-build time is measured in the perf-infra report, and the
# gate's perf step (tools/gate-checks/run-gate.sh) enforces the new
# sizes. Applies workspace-wide, including the bench profile
# (bench inherits release), so bench builds pay the LTO cost too.
strip = true
# R3-18 (Round 3 WS-2): `debug = true` so the release build emits
# PDBs (MSVC) next to the binaries — release.yml archives them per
# tag as a non-release artifact, so a field crash can be
# symbolicated. NOTE (v2.0.7 release run 44962668126): on Windows-MSVC
# cargo's `strip` DELETES the .pdb files, so `strip = true` + `debug =
# true` yields no PDBs and the release PDB step fails closed. The
# release job therefore sets CARGO_PROFILE_RELEASE_STRIP=false (see
# release.yml) — strip stays on for CI/local builds, where the Linux
# binary sizes + perf-gate limits are measured with it. NOTE 2
# (v2.0.7 release run 44967991529, strip already off, still failed):
# rustc names the PDB after the CRATE name — `rsh_daemon.pdb`, NOT
# `rsh-daemon.pdb` (proven by the CodeView record in the shipped
# v2.0.6 exe); release.yml searches for the underscore names. If
# `debug` is ever turned off, the release.yml PDB step fails closed —
# do not silence it.
debug = true
lto = "fat"
codegen-units = 1

# PERF P3-6 (polish round): bench builds inherit `release` above,
# so even a local `cargo bench` paid the full fat-LTO link (~10 min
# wall on this VM). The bench profile keeps the release opts except
# LTO / single codegen unit, for iteration speed only — shipped
# binaries still use `[profile.release]`.
[profile.bench]
inherits = "release"
lto = false
codegen-units = 16
debug = false
