; RSH firmware — PlatformIO build (ESP32 DevKit V1)
;
;   pio run                 -> build
;   pio run -t upload       -> flash over USB
;   pio run -t monitor      -> serial monitor (needs RSH_DEBUG 1 in config.h)
;
; After every build a MERGED factory image is written to
;   .pio/build/esp32dev/RSH-Firmware-DevKitV1-v<version>.bin
; (bootloader + partitions + app, flash at 0x0 — see docs/FLASH-GUIDE.md).
; The plain firmware.bin in the same folder is the app-only image for OTA.

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Default partition table = two OTA app slots (needed for safe Web/Arduino OTA).
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB

build_flags =
    -Wall
    -Werror
    -Wno-unused-variable
    -DCORE_DEBUG_LEVEL=0

extra_scripts = post:merge_bin.py
    post:sign_firmware.py

; ---- Secure build (Phase H, OPEN-3 / SEC-E-01) ----
; Sirf sacrificial-board procedure (docs/FLASH-ENCRYPTION-PROCEDURE.md)
; ke liye. Normal build (esp32dev) is se mutasir NAHI hota.
;   framework = arduino, espidf — ZAROORI: plain arduino precompiled
;   IDF istemal karta hai, sdkconfig flags (Secure Boot / flash
;   encryption / NVS encryption) us mein laagu NAHI hote. IDF source
;   build hi sdkconfig.secure.defaults ko laagu karta hai.
;   - Pehla build lamba hota hai (IDF source compile).
;   - Is env ko build karna eFuse BURN NAHI karta — burn alag manual
;     step hai (procedure §3–§4). Sirf binary banana mehfooz hai.
;   - Build karne se pehle secure-boot private key ko
;     firmware/rsh/secure-boot-key.pem par copy karo (gitignored *.pem;
;     asal key ~/workspace/projects/rsh/signing-keys/ mein hai) aur
;     build ke baad wapas mita do. RSH_SIGNING_KEY (Ed25519 OTA signing)
;     wahi env var se aati hai.
;   - SANDBOX MEIN BUILD-VERIFY NAHI HUA: ye env is VM par kabhi build
;     nahi hua (lamba IDF build + 4-hour soak chal raha tha). Procedure
;     ka step 0 is ka build + generated sdkconfig ka check hai — kisi bhi
;     irreversible eFuse step se pehle. Build fail ho to STOP, eFuse ko
;     haath mat lagao.
[env:esp32dev-secure]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino, espidf

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions-secure.csv
board_build.esp-idf.sdkconfig_path = sdkconfig.secure.defaults
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB

build_flags =
    -Wall
    -Werror
    -Wno-unused-variable
    -DCORE_DEBUG_LEVEL=0
    -DRSH_SECURE_NVS=1

extra_scripts = post:merge_bin.py
    post:sign_firmware.py
