# deny.toml — RSH Rust supply-chain policy (Phase A4, SW-R1.3 / SECURITY-INPUT §6.3, §9)
#
# Enforced in CI by `cargo deny check` (.github/workflows/ci.yml, audit job).
# Schema verified 2026-11-14 against the cargo-deny docs
# (embarkstudios.github.io/cargo-deny/checks/cfg.html and the
# advisories/licenses/sources cfg pages). Notes on the CURRENT schema:
#   * [advisories] `vulnerability` was REMOVED — all vulnerability advisories
#     now emit errors by default. Do not re-add it; it errors.
#   * [licenses] `unlicensed`, `deny`, `copyleft`, `default` were REMOVED —
#     every license NOT in `allow` is denied by default. Do not re-add them.
#   * [licenses] `confidence-threshold` default is 0.8.
#
# License allow-list — permissive only (SECURITY-INPUT §6.3: MIT/Apache-2.0/
# BSD; GPL/AGPL/LGPL denied by default because they are not listed):
#   * MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause — the required core.
#   * Apache-2.0 WITH LLVM-exception, ISC, Unicode-3.0, Unicode-DFS-2016,
#     Zlib — narrow permissive extras the Rust ecosystem itself needs
#     (e.g. unicode-ident is "(MIT OR Apache-2.0) AND Unicode-DFS-2016";
#     without Unicode-DFS-2016 the license check would fail on a ubiquitous
#     crate on day one). All five are permissive, none is copyleft. If the
#     coordinator wants the list tightened to the four core IDs only, delete
#     these five lines — that is a one-line policy change, not a schema fix.
#   * Anything else (including all strong copyleft: GPL/AGPL/LGPL) is denied.
#     A crate that needs a different license gets a per-crate
#     [[licenses.exceptions]] entry with a reason, or it does not ship.
#   * MPL-2.0 is the ONE weak-copyleft exception (added Phase A gate,
#     2026-11-14): it is a file-level copyleft, and it enters the tree only
#     via Tauri 2.12.5's cssparser/dom_query chain (cssparser, cssparser-macros,
#     dtoa-short, option-ext, ...). Depending on an MPL-2.0 crate does not
#     impose copyleft on RSH's own MIT code. Strong copyleft stays denied.
#
# Sources — crates.io only (SECURITY-INPUT §0, §9): git dependencies are
# denied; a git dependency needs an explicit allow-git entry + justification.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# H2 (deep-scan Round 2): yanked = "deny". It used to be "warn" because
# `cargo audit` exits 0 even when the yanked check never completed
# (612× "couldn't check if the package is yanked" in the Phase H gate) —
# a warn there is no verdict at all. The CI audit job now retries the
# audit up to 3 times and FAILS if the yanked verdict is still missing,
# which makes the registry check reliable in CI (registry reachable);
# on that basis the deny policy is deny, not warn. Verified locally
# 2026-11-14: `cargo deny check` passes with yanked = "deny" (exit 0,
# "advisories ok, bans ok, licenses ok, sources ok") — cargo-deny
# resolves yanked status from its local advisory data, so unlike
# `cargo audit` it does not need the sandbox-blocked registry fetch.
yanked = "deny"
unmaintained = "all"
unsound = "workspace"
# Ignores (TESTING-INPUT §9.1: ignore only with id + reason + expiry).
# The first four are transitive dependencies of Tauri 2.12.5's Linux/GTK stack
# (tao → gtk → zbus/zvariant/glib); the four below are transitive via
# Slint 1.18.1 (v2.0 UI), except chrono which also enters via Tauri
# (serde_with <- tauri-utils). None is a direct dependency of any rsh-* crate
# and none is a vulnerability in RSH code. Plain `cargo audit`
# already exits 0 on these (they are warnings, not errors); they are
# ignored here only so the stricter deny checks stay green and honest.
# Review date for all eight: 2027-02-14 (re-check whether a Tauri/Slint bump
# removed them; if yes, drop the entry).
ignore = [
    # RUSTSEC-2024-0370 — proc-macro-error 1.0.4, unmaintained. No fixed upgrade exists.
    "RUSTSEC-2024-0370",
    # RUSTSEC-2026-0371 — zbus_names 4.3.5, unmaintained. No fixed upgrade exists.
    "RUSTSEC-2026-0371",
    # RUSTSEC-2026-0370 — zvariant 5.15.1, unmaintained. No fixed upgrade exists.
    "RUSTSEC-2026-0370",
    # RUSTSEC-2026-0372 — zvariant_derive 5.15.1, unmaintained. No fixed upgrade exists.
    "RUSTSEC-2026-0372",
    # RUSTSEC-2025-0141 — bincode 2.0.1, unmaintained. Transitive (in
    # Cargo.lock; Windows-target graph, not in the Linux tree). No fixed upgrade exists.
    "RUSTSEC-2025-0141",
    # RUSTSEC-2026-0441 — pin-utils 0.1.1, unmaintained. Transitive via
    # Slint (spin_on <- slint-build). No fixed upgrade exists.
    "RUSTSEC-2026-0441",
    # RUSTSEC-2026-0192 — ttf-parser 0.25.1, unmaintained. Transitive via
    # Slint (ab_glyph <- winit <- i-slint-backend-winit). No fixed upgrade exists.
    "RUSTSEC-2026-0192",
    # RUSTSEC-2026-0543 — chrono 0.4.45, unmaintained. Transitive via
    # Slint (i-slint-core 1.18.1 <- slint 1.18.1) and via Tauri
    # (serde_with 3.24.0 <- tauri-utils 2.10.2). No fixed upgrade exists.
    "RUSTSEC-2026-0543",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    # BSL-1.0 (Boost Software License, OSI-approved, permissive):
    # clipboard-win + error-code, via arboard <- Slint winit
    # backend. Added 2026-11-16 (v2.0 release gate): the Slint
    # tree was never deny-checked before.
    "BSL-1.0",
    # Slint royalty-free license (LicenseRef-Slint-Royalty-free-2.0):
    # all Slint crates are "GPL-3.0-only OR LicenseRef-Slint-
    # Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0". The
    # project uses Slint under the Royalty-free 2.0 license
    # (REDESIGN-PLAN: GPLv3 is NOT used) — allowing the
    # Royalty-free ref satisfies the OR without allowing GPL.
    "LicenseRef-Slint-Royalty-free-2.0",
    # Unlicense (public-domain dedication, permissive): ksni
    # 0.3.7 (Slint tray backend dependency).
    "Unlicense",
]
# Workspace crates are MIT-licensed (LICENSE, user decision); do not
# license-check unpublished workspace members.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
