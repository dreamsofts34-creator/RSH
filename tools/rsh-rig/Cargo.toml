[package]
name = "rsh-rig"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RSH Virtual Test Rig (Phase H2, SW-R8.2): seeded virtual wheel + real WheelEngine + recording output, 26 scenarios, quick/full/long modes including the 4-hour soak."
publish = false

[[bin]]
name = "rsh-rig"
path = "src/main.rs"

[dependencies]
rsh-api = { path = "../../crates/rsh-api" }
rsh-app-core = { path = "../../crates/rsh-app-core" }
rsh-ipc = { path = "../../crates/rsh-ipc" }
rsh-output = { path = "../../crates/rsh-output" }
rsh-profiles = { path = "../../crates/rsh-profiles" }
rsh-protocol = { path = "../../crates/rsh-protocol" }
rsh-engine = { path = "../../crates/rsh-engine" }
rsh-security = { path = "../../crates/rsh-security" }
rsh-benchmarks = { path = "../rsh-benchmarks" }
# OTA e2e checks: throwaway-signed test images only (never the
# production key) — same pins as rsh-security / rsh-app-core dev-deps.
ed25519-dalek = "=3.0.0"
sha2 = "=0.11.1"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
